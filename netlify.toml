# Menerbitkan AkarKu di Netlify dengan alamat sesuai nama aplikasi (misalnya https://akarku.netlify.app).
# API key Si Akar diambil dari Environment variable Netlify (OPENROUTER_API_KEY), tidak pernah disimpan di repositori.
[build]
  publish = "AkarKu/app"
  command = "node -e \"require('fs').writeFileSync('AkarKu/app/config.js','window.AKARKU_AI='+JSON.stringify({provider:'openrouter',key:process.env.OPENROUTER_API_KEY||'',model:process.env.OPENROUTER_MODEL||'nvidia/nemotron-3-ultra-550b-a55b:free'})+';\n')\""

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
