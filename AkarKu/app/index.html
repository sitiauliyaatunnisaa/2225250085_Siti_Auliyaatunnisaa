<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5D8A">
<title>AkarKu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: satu kolom mobile-first (maks 560px), TopBar lengket di atas, bilah aksi lengket di zona jempol */
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --text:#1F2937; --muted:#6B7280; --border:#E5E7EB;
  --primary:#2F5D8A; --on-primary:#FFFFFF; --primary-soft:#E8EFF6;
  --accent:#C2410C; --success:#15803D; --success-bg:#F0FDF4; --danger:#B91C1C; --danger-bg:#FEF2F2;
  --hint:#FEF9C3; --hint-ink:#713F12;
  --font:'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1B1A; --surface:#262523; --text:#ECEAE6; --muted:#A3A09A; --border:#3A3835;
  --primary:#7FA9D6; --on-primary:#0F1E2D; --primary-soft:#22303D;
  --accent:#FB923C; --success:#4ADE80; --success-bg:#14281B; --danger:#F87171; --danger-bg:#2D1616;
  --hint:#3F3A1E; --hint-ink:#FDE68A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1C1B1A; --surface:#262523; --text:#ECEAE6; --muted:#A3A09A; --border:#3A3835;
  --primary:#7FA9D6; --on-primary:#0F1E2D; --primary-soft:#22303D;
  --accent:#FB923C; --success:#4ADE80; --success-bg:#14281B; --danger:#F87171; --danger-bg:#2D1616;
  --hint:#3F3A1E; --hint-ink:#FDE68A; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:1.0625rem;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* TopBar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:56px}
.iconbtn{min-width:48px;min-height:48px;border:0;background:transparent;border-radius:var(--r);font-size:1.4rem;cursor:pointer;touch-action:manipulation}
.iconbtn:active{background:var(--primary-soft)}
.top h1{font-size:1.125rem;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:64px;height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary)}

main{flex:1;padding-block:20px 24px}
main .wrap{display:flex;flex-direction:column;gap:16px}
h2{font-size:1.375rem;font-weight:800;margin:0;text-wrap:balance}
h3{font-size:1.0625rem;font-weight:800;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9375rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mx{font-size:1.4rem;font-weight:600;overflow-x:auto;padding:6px 0;white-space:nowrap}
.mx.center{text-align:center}
.hl{color:var(--accent);font-weight:800;background:transparent}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Bentuk akar & pecahan */
.rad{display:inline-flex;align-items:flex-start;white-space:nowrap;vertical-align:baseline}
.rad .s{line-height:1.15;padding-right:1px}
.rad .b{border-top:2px solid currentColor;line-height:1.15;padding:0 3px;margin-top:.14em}
.rad .idx{font-size:.58em;line-height:1;margin-right:-.3em;position:relative;top:-.05em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px}
.frac .fn{border-bottom:2px solid currentColor;padding:0 4px 2px;line-height:1.3}
.frac .fd{padding:2px 4px 0;line-height:1.3}
.grp{color:var(--accent);font-weight:800}

/* Langkah */
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;flex-direction:column;gap:2px;transition:opacity .2s;min-width:0}
.step.past{opacity:.6}
.step .why{font-size:.9375rem;color:var(--muted)}
.step .no{font-size:.75rem;font-weight:800;color:var(--primary);letter-spacing:.04em}

/* Pilihan jawaban */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:52px;text-align:left;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:1.0625rem;touch-action:manipulation}
.opt:active{background:var(--primary-soft)}
.opt.sel-ok{border-color:var(--success);background:var(--success-bg)}
.opt.sel-no{border-color:var(--danger);background:var(--danger-bg)}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--primary);background:var(--primary-soft);font-weight:700}
.qdots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qdot{min-height:44px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.qdot.has{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.qdot.cur{outline:3px solid var(--accent);outline-offset:1px}

/* Umpan balik */
.fb{border-left:4px solid var(--border);background:var(--surface);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{border-color:var(--success);background:var(--success-bg)}
.fb.no{border-color:var(--danger);background:var(--danger-bg)}
.fb b.h{font-size:1.0625rem}
.fb.ok b.h{color:var(--success)} .fb.no b.h{color:var(--danger)}

/* Petunjuk */
.hintbtn{align-self:flex-start;min-height:48px;padding:0 14px;border:1px dashed var(--border);border-radius:var(--r);background:transparent;cursor:pointer;color:var(--primary);font-weight:700}
.hint{background:var(--hint);color:var(--hint-ink);border-radius:var(--r);padding:12px 14px;font-size:.9375rem}
.hint .tag{color:inherit;opacity:.8}

/* Jawaban & papan ketik */
.ans{min-height:60px;border:2px solid var(--primary);border-radius:var(--r);background:var(--surface);display:flex;align-items:center;padding:0 16px;font-size:1.5rem;font-weight:700;overflow-x:auto;white-space:nowrap}
.ans .ph{color:var(--muted);font-size:1rem;font-weight:400}
.ans .caret{display:inline-block;width:2px;height:1.4em;background:var(--primary);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.ans .caret{animation:none}.step{transition:none}}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key{min-height:50px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:1.25rem;font-weight:700;cursor:pointer;touch-action:manipulation}
.key:active{background:var(--primary-soft)}
.key.fn{font-size:1rem;color:var(--muted)}
.key[disabled]{opacity:.35}

/* Bilah aksi bawah */
.actions{position:sticky;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.actions .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.row{display:flex;gap:8px}
.row > *{flex:1;min-width:0}
.btn{min-height:52px;border-radius:var(--r);border:0;font-weight:700;font-size:1.0625rem;cursor:pointer;touch-action:manipulation;padding:0 14px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:active{filter:brightness(.92)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--border)}
.btn.danger{background:var(--danger);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:default}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:.9375rem;font-weight:700;cursor:pointer;color:var(--primary)}
.tool[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.linkbtn{border:0;background:transparent;color:var(--primary);font-weight:700;cursor:pointer;min-height:44px;padding:0 4px;text-decoration:underline}

/* Beranda */
.hero{display:flex;flex-direction:column;gap:6px}
.logo{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
.logo .rad .b{border-top-width:3px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{min-height:112px;text-align:left;padding:14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;gap:4px;cursor:pointer;touch-action:manipulation;min-width:0}
.mcard:active{background:var(--primary-soft)}
.mcard .ic{font-size:1.5rem}
.mcard b{font-size:1.0625rem}
.mcard span{font-size:.875rem;color:var(--muted)}
.mcard.wide{grid-column:1 / -1;min-height:auto;flex-direction:row;align-items:center;gap:12px}
.mcard.wide > div{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.field{min-height:52px;width:100%;box-sizing:border-box;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface);padding:0 14px;font-size:1rem;font-family:inherit;color:var(--text)}
textarea.field{min-height:84px;padding:12px 14px;resize:vertical}
.note{font-size:.875rem;color:var(--muted);border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.flabel{display:flex;flex-direction:column;gap:6px;font-weight:700}

/* Segmen */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:700;cursor:pointer;font-size:.9375rem}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}

/* Literasi */
.stim{font-size:1.0625rem}
.chip{display:inline-block;min-height:36px;padding:2px 8px;margin:2px 0;border:1.5px dashed var(--primary);border-radius:8px;background:transparent;font-weight:800;cursor:pointer;color:var(--text)}
.chip.on{border-style:solid;background:var(--primary-soft);color:var(--primary)}
.cycle{display:flex;gap:6px}
.cycle span{flex:1;text-align:center;font-size:.8125rem;font-weight:700;padding:6px 4px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.cycle span.on{border-color:var(--primary);color:var(--primary)}
.cycle span.done{color:var(--success);border-color:var(--success)}
.nl{position:relative;height:56px;margin:4px 8px 0}
.nl .line{position:absolute;left:0;right:0;top:18px;height:2px;background:var(--muted)}
.nl .tick{position:absolute;top:12px;width:2px;height:14px;background:var(--muted)}
.nl .lbl{position:absolute;top:30px;transform:translateX(-50%);font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nl .dot{position:absolute;top:11px;width:16px;height:16px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.nl .dl{position:absolute;top:-10px;transform:translateX(-50%);font-size:.8125rem;font-weight:800;color:var(--accent);white-space:nowrap}
.cmp{display:grid;grid-template-columns:auto auto;justify-content:start;gap:6px 20px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r);font-variant-numeric:tabular-nums}
.cmp b{font-size:1.125rem}

/* Refleksi */
.paas{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.paas button{min-height:48px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);font-weight:800;cursor:pointer}
.paas button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
ol.pola{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}

/* Kalkulator */
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.inp{display:flex;flex-direction:column;gap:4px;font-size:.875rem;font-weight:700;color:var(--muted);min-width:0}
.inp input{min-height:52px;font-size:1.25rem;font-weight:800;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);padding:0 12px;font-family:inherit;width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}
.preview{font-size:1.6rem;font-weight:700;text-align:center;padding:8px 0;overflow-x:auto;white-space:nowrap;min-height:2.6em;display:flex;align-items:center;justify-content:center}
.result{border:2px solid var(--primary);border-radius:var(--r);padding:14px;text-align:center;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.result .mx{font-size:1.65rem}
.kv{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.kv > div{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-bottom:1px solid var(--border);min-width:0}
.kv > div:last-child{border-bottom:0}
.kv span{font-size:.8125rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.kv b{font-size:1.0625rem;font-weight:700;overflow-x:auto;white-space:nowrap}
.err{color:var(--danger);font-weight:700;font-size:.9375rem}

/* Pemilik */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--border);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.8125rem;color:var(--muted);font-weight:700}
.vcard{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.vhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.vhead > div{min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.8125rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--border);font-variant-numeric:tabular-nums}
.pill.good{border-color:var(--success);color:var(--success)}
.pill.bad{border-color:var(--danger);color:var(--danger)}
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table.tbl{border-collapse:collapse;font-size:.875rem;min-width:520px;width:100%}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.tbl th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg);position:sticky;top:0}
.tbl td.ok{color:var(--success);font-weight:800}
.tbl td.no{color:var(--danger);font-weight:800}
.tbl td.t{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:16px 16px 0 0;max-height:80%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{display:flex;flex-direction:column;gap:12px;padding-block:8px 16px;overflow-y:auto}
.sheet .head{display:flex;align-items:center;justify-content:space-between}
.sq{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sq div{border:1px solid var(--border);border-radius:8px;padding:8px 4px;text-align:center;font-variant-numeric:tabular-nums;font-size:.9375rem;min-width:0;overflow:hidden}
.sq div b{display:block;font-size:1.0625rem}
.sqform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sqone{display:flex;flex-direction:column;gap:8px;border:1px solid var(--border);border-radius:var(--r);padding:12px}
.sqone .out{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
.fcard{border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px}
.fcard .mx{font-size:1.2rem}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app" id="app"></div>
<div id="sheetRoot"></div>

<script>
/* ================= Penyimpanan di perangkat ================= */
const KEY='akarku-prototipe-v2';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
const P=Object.assign({users:{},current:null,log:[],pin:null},load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
const U=()=>P.users[P.current];
function newUser(name,code){
  const id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  P.users[id]={name,code,created:Date.now(),li:0,lessonDone:false,quizScore:null,quizBest:null,litDone:false,paas:null};
  return id;
}
function logEv(area,q,ans,ok,extra){
  if(!P.current) return;
  const ev=Object.assign({id:P.current+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),uid:P.current,t:Date.now(),area,q:q||'',ans:ans==null?'':String(ans),ok:ok===undefined?null:ok},extra||{});
  P.log.push(ev);
  if(P.log.length>5000) P.log.splice(0,P.log.length-5000);
  queueSync(ev);
  save();
}

/* ================= Rekap online ke Google Sheets =================
   Tempel URL Web App Google Apps Script di SYNC_URL (lihat docs/13-rekap-online-google-sheets.md).
   Jika dikosongkan, aplikasi tetap berjalan, tetapi riwayat hanya tersimpan di perangkat. */
const CONFIG={
  SYNC_URL:''
};
/* Jika aplikasi dibuka dari Google Apps Script (cara utama, docs/13), data dikirim lewat google.script.run
   tanpa perlu mengisi SYNC_URL. Jika dipublikasikan di tempat lain (misalnya Netlify), isi SYNC_URL. */
const GAS=typeof google!=='undefined'&&!!(google.script&&google.script.run);
const SYNC_ON=GAS||/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(CONFIG.SYNC_URL.trim());
function gasCall(fn,arg){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](arg))}
async function apiPost(body){
  if(GAS) return body.type==='events'?gasCall('saveEventsApi',body.events):gasCall('readDataApi',body.key);
  const res=await fetch(CONFIG.SYNC_URL.trim(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  return res.json();
}
if(!Array.isArray(P.outbox)) P.outbox=[];
let flushTimer=null, flushing=false;
function queueSync(ev){
  if(!SYNC_ON) return;
  const u=P.users[ev.uid]||{};
  P.outbox.push(Object.assign({name:u.name||'',code:u.code||''},ev));
  if(P.outbox.length>3000) P.outbox.splice(0,P.outbox.length-3000);
  clearTimeout(flushTimer); flushTimer=setTimeout(flush,1500);
}
async function flush(){
  if(!SYNC_ON||flushing||!P.outbox.length||navigator.onLine===false) return;
  flushing=true; let more=false;
  try{
    const batch=P.outbox.slice(0,50);
    const j=await apiPost({type:'events',events:batch});
    if(j&&j.ok&&Array.isArray(j.ids)){ const done=new Set(j.ids); P.outbox=P.outbox.filter(e=>!done.has(e.id)); save(); more=P.outbox.length>0; }
  }catch(_){ /* tidak ada internet atau server sibuk: dicoba lagi nanti */ }
  finally{ flushing=false; }
  if(more) setTimeout(flush,500);
}
window.addEventListener('online',flush);
setInterval(flush,20000);
function anchorDownload(name,data,type){
  try{ const url=URL.createObjectURL(new Blob([data],{type})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),3000); return true; }catch(_){ return false; }
}

/* ================= Util ================= */
const R=b=>`<span class="rad"><span class="s">√</span><span class="b">${b}</span></span>`;
const RI=(n,b)=>n===2?R(b):`<span class="rad"><sup class="idx">${n}</sup><span class="s">√</span><span class="b">${b}</span></span>`;
const H=x=>`<mark class="hl">${x}</mark>`;
const FR=(x,y)=>`<span class="frac"><span class="vh">(</span><span class="fn">${x}</span><span class="vh">)/(</span><span class="fd">${y}</span><span class="vh">)</span></span>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=h=>String(h).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t}return a}
function lpsf(n){for(let k=Math.floor(Math.sqrt(n));k>=1;k--){if(n%(k*k)===0)return k*k}return 1}
function factor(n){const f=[];let d=2;while(d*d<=n){let e=0;while(n%d===0){n/=d;e++}if(e)f.push([d,e]);d+=d===2?1:2}if(n>1)f.push([n,1]);return f}
function ipow(b,e){let r=1;for(let i=0;i<e;i++)r*=b;return r}
function simplifyN(b,n){const f=factor(b);let k=1,m=1;f.forEach(([p,e])=>{k*=ipow(p,Math.floor(e/n));m*=ipow(p,e%n)});return {k,m,f}}
function iroot(b,n){let k=Math.floor(Math.pow(b,1/n)+1e-9);while(k>0&&ipow(k,n)>b)k--;while(ipow(k+1,n)<=b)k++;return k}
const supN=n=>n===2?'²':n===3?'³':`<sup>${n}</sup>`;
const CRN=(c,n,m)=>m===1?num(c):(c===1?'':num(c))+RI(n,num(m));
const CR=(c,m)=>CRN(c,2,m);
const CRs=(c,m)=>c===0?'0':(c<0?'−':'')+CR(Math.abs(c),m);
const idxName=n=>n===2?'akar kuadrat':n===3?'akar pangkat tiga':'akar pangkat '+n;
const perfName=n=>n===2?'kuadrat sempurna':n===3?'pangkat tiga sempurna (kubik)':'pangkat '+n+' sempurna';
function fracRad(nu,de,m){ // (nu√m)/de, disederhanakan
  if(de<0){nu=-nu;de=-de}
  const g=gcd(nu,de)||1; nu/=g; de/=g;
  const neg=nu<0, a=Math.abs(nu);
  if(de===1) return (neg?'−':'')+CR(a,m);
  return (neg?'−':'')+FR(CR(a,m),num(de));
}
function fmtInput(s){if(!s)return'';const i=s.indexOf('√');if(i<0)return esc(s);return esc(s.slice(0,i))+R(s.slice(i+1)||'&nbsp;&nbsp;')}
function parse(s){
  const m=/^(\d*)(?:√(\d+))?$/.exec(s);
  if(!s||!m||(s.includes('√')&&!m[2])) return null;
  if(!m[1]&&!m[2]) return null;
  return {a:m[1]?parseInt(m[1],10):1,b:m[2]?parseInt(m[2],10):1};
}
function mk(c,k,m){return {c,k,m,n:k*k*m,coef:c*k}}
const problemHTML=q=>(q.c>1?q.c:'')+R(q.n);
const problemPlain=q=>(q.c>1?q.c:'')+'√'+q.n;
function solution(q){
  const k2=q.k*q.k;
  if(q.c===1) return `${R(q.n)} = ${R(H(k2)+' × '+q.m)} = ${H(q.k)}${R(q.m)}`;
  return `${q.c}${R(q.n)} = ${q.c} × ${R(H(k2)+' × '+q.m)} = ${q.c} × ${q.k}${R(q.m)} = ${H(q.coef)}${R(q.m)}`;
}
function check(input,q){
  const v=parse(input);
  if(!v) return {ok:false,msg:'Tulis jawaban dalam bentuk a√b, misalnya 6√2.',invalid:true};
  const {a,b}=v,E=q.coef,m=q.m,k2=q.k*q.k;
  const equiv=a*a*b===E*E*m;
  if(equiv&&lpsf(b)===1) return {ok:true,msg:`Tepat! ${solution(q)}`};
  if(equiv) return {ok:false,msg:`Hampir! Nilainya sudah benar, tetapi ${b} masih punya faktor kuadrat sempurna ${H(lpsf(b))}. Sederhanakan lagi.`};
  if(a===m&&b===E) return {ok:false,msg:`Tertukar. Angka yang keluar dari akar adalah ${E}, sedangkan ${m} tetap di dalam akar.`};
  if(a===k2*q.c&&b===m) return {ok:false,msg:`Ingat, yang keluar adalah akarnya: ${R(k2)} = ${q.k}, bukan ${k2}.`};
  if(q.c>1&&a===q.k&&b===m) return {ok:false,msg:`Hampir! Jangan lupa angka ${q.c} di depan: ${q.c} × ${q.k} = ${E}.`};
  if(a===E&&b!==m) return {ok:false,msg:`Angka di luar akar sudah benar. Cek lagi angka di dalam akar: ${q.n} ÷ ${k2} = ${m}.`};
  return {ok:false,msg:`Belum tepat. Cari kuadrat sempurna terbesar yang membagi ${q.n}, yaitu ${k2}.`};
}
function gen(level,avoid){
  const ms=[2,3,5,6,7,10,11];
  for(let t=0;t<500;t++){
    let c=1,k=rnd(2,10),m=pick(ms),n=k*k*m,ok=false;
    if(level==='mudah') ok=n>=8&&n<=50;
    else if(level==='sedang') ok=n>50&&n<=200;
    else { if(Math.random()<.5){ok=n>200&&n<=600}else{c=rnd(2,4);ok=n>=8&&n<=75} }
    if(ok&&n!==avoid) return mk(c,k,m);
  }
  return mk(1,3,2);
}

  return `<main><div class="wrap">
    <div class="hero"><div class="logo">${R('Akar')}Ku</div><h2>Halo, ${esc(u.name)} 👋</h2><p class="muted">Modul M2: Menyederhanakan Bentuk Akar</p></div>
    <div class="menu">
      <button class="mcard wide" data-act="nav" data-to="belajar"><span class="ic">📖</span><div><b>Belajar</b><span>${pct}${u.quizScore!==null?` · Kuis ${u.quizScore}/5`:''}</span></div></button>
      <button class="mcard" data-act="nav" data-to="latihan"><span class="ic">✏️</span><b>Latihan</b><span>${pr.length?`${pb} benar dari ${pr.length}`:'Mudah · Sedang · Sulit'}</span></button>
      <button class="mcard" data-act="nav" data-to="literasi"><span class="ic">🌏</span><b>Pojok Literasi</b><span>${u.litDone?'Selesai ✓':'Ubin dan kotak Pak Budi'}</span></button>
      <button class="mcard wide" data-act="nav" data-to="soal"><span class="ic">📝</span><div><b>Paket Soal</b><span>${['mudah','sedang','sulit'].map(l=>{const r=(u.paket||{})[l];return LEVEL_INFO[l][0]+(r?': '+r.last:'')}).join(' · ')} · 10 soal, ada nilai di akhir</span></div></button>
      <button class="mcard wide" data-act="nav" data-to="kalkulator"><span class="ic">🧮</span><div><b>Kalkulator Akar</b><span>Akar kuadrat, pangkat tiga, dan lainnya, lengkap dengan langkah-langkahnya</span></div></button>
      <button class="mcard" data-act="sheet" data-tab="rumus"><span class="ic">📘</span><b>Kartu Rumus</b><span>Buka kapan saja</span></button>
      <button class="mcard" data-act="sheet" data-tab="tabel"><span class="ic">🔢</span><b>Tabel Kuadrat</b><span>Pilih angkamu sendiri</span></button>
    </div>
    <div class="card"><h3>📄 Laporan hasil belajarku</h3>
      <p class="small muted">Simpan nilai dan riwayat jawabanmu sebagai file PDF. File bisa dibuka dan disimpan di HP.</p>
      <button class="btn primary" data-act="sharePdf">Unduh laporan PDF</button>
      ${S.share?`${S.share.msg?`<p class="small">${S.share.msg}</p>`:''}${S.share.text?`<textarea class="field" id="shareBox" readonly style="min-height:110px;font-family:ui-monospace,monospace;font-size:.75rem">${esc(S.share.text)}</textarea><button class="tool" data-act="copyShare">Salin teks hasilku</button>`:''}`:''}
    </div>
    <div class="note"><span>Bukan ${esc(u.name)}? Ganti pengguna agar jawabanmu tercatat atas namamu sendiri.</span>
      <div class="tools"><button class="tool" data-act="logout">👤 Ganti pengguna</button><button class="linkbtn" data-act="nav" data-to="pemilik">Mode pemilik</button></div></div>
  </div></main>`;

/* ================= Belajar ================= */
function viewBelajar(){
  const u=U(), L=LESSON[u.li], s=S.scr; let body='', bar='';
  const nav=(canNext,label='Lanjut →')=>`<div class="row"><button class="btn ghost" data-act="prev" ${u.li===0?'disabled':''}>← Kembali</button><button class="btn primary" data-act="next" ${canNext?'':'disabled'}>${label}</button></div>`;
  if(L.kind==='text'){
    body=`${L.tag?`<span class="tag">${L.tag}</span>`:''}<h2>${L.title}</h2><div class="card">${L.html}<div class="mx center">${L.mx}</div></div>${L.tip?`<p class="muted small">${L.tip}</p>`:''}`;
    bar=nav(true);
  } else if(L.kind==='worked'){
    const st=L.steps.map((x,i)=>i<s.rev?`<div class="step ${i<s.rev-1?'past':''}"><div class="mx">${x.mx}</div><div class="why">${x.why}</div></div>`:'').join('');
    body=`<span class="tag">Contoh lengkap</span><h2>${L.title}</h2><div class="card"><p><b>${L.problem}</b></p><div class="steps">${st}</div></div><p class="muted small">Langkah ${s.rev} dari ${L.steps.length}</p>`;
    const more=s.rev<L.steps.length;
    bar=`<div class="row"><button class="btn ghost" data-act="replay">↺ Ulangi</button>${more?`<button class="btn primary" data-act="reveal">Langkah berikutnya ↓</button>`:`<button class="btn primary" data-act="next">Lanjut →</button>`}</div>`;
  } else if(L.kind==='faded'){
    const parts=L.parts.slice(0,s.part+1).map((p,pi)=>{
      const pk=s.picked[pi]||[], solved=pk.includes(p.correct);
      const opts=p.options.map((o,oi)=>`<button class="opt ${pk.includes(oi)?(oi===p.correct?'sel-ok':'sel-no'):''}" data-act="pick" data-p="${pi}" data-o="${oi}" ${solved||pk.includes(oi)?'disabled':''}>${o}</button>`).join('');
      const last=pk[pk.length-1];
      const fb=last===undefined?'':(last===p.correct?fbBox(true,p.ok):fbBox(false,p.no[last]));
      return `<div class="card"><p>${p.ask}</p><div class="opts">${opts}</div>${fb}</div>`;
    }).join('');
    body=`<span class="tag">Contoh rumpang</span><h2>${L.title}</h2><div class="card"><p><b>${L.problem}</b></p>${L.given.map(g=>`<div class="mx">${g}</div>`).join('')}</div>${parts}`;
    bar=nav(s.done);
  } else if(L.kind==='explain'){
    const pk=s.picked[0];
    const opts=L.options.map((o,oi)=>`<button class="opt ${pk===oi?(oi===L.correct?'sel-ok':'sel-no'):(pk!==undefined&&oi===L.correct?'sel-ok':'')}" data-act="pick1" data-o="${oi}" ${pk!==undefined?'disabled':''}>${o}</button>`).join('');
    body=`<span class="tag">Jelaskan</span><h2>${L.title}</h2><div class="card"><p>${L.q}</p><div class="opts">${opts}</div>${pk!==undefined?fbBox(pk===L.correct,L.fb,pk===L.correct?'Tepat!':'Perhatikan'):''}</div>`;
    bar=nav(s.done);
  } else if(L.kind==='pattern'){
    body=`<span class="tag">Ringkasan</span><h2>${L.title}</h2><div class="card"><ol class="pola">${L.points.map(x=>`<li>${x}</li>`).join('')}</ol></div><p class="muted small">Pola ini berlaku untuk semua soal menyederhanakan bentuk akar.</p>`;
    bar=nav(true);
  } else if(L.kind==='context'){
    const pk=s.picked[0];
    const opts=L.options.map((o,oi)=>`<button class="opt ${pk===oi?(oi===L.correct?'sel-ok':'sel-no'):''}" data-act="pick1" data-o="${oi}" ${pk===L.correct||pk===oi?'disabled':''}>${o}</button>`).join('');
    const st=L.steps.map(x=>`<div class="step"><div class="mx">${x.mx}</div><div class="why">${x.why}</div></div>`).join('');
    const cmp=`<div class="cmp">${L.cmp.map(c=>`<span>${c[0]}</span><b>${c[1]}</b>`).join('')}</div>`;
    body=`<span class="tag">${L.tag}</span><h2>${L.title}</h2><div class="card">${L.intro}<div class="steps">${st}</div></div><div class="card">${L.q}${cmp}<div class="opts">${opts}</div>${pk!==undefined?fbBox(pk===L.correct,pk===L.correct?L.fb:L.fbNo):''}</div>`;
    bar=nav(s.done);
  } else if(L.kind==='quiz'){
    const z=s.quiz;
    if(z.i>=QUIZ.length){
      body=`<span class="tag">Kuis modul</span><h2>Skor kuismu: ${z.score}/5</h2><div class="card"><p>${z.score>=4?'Hebat! Kamu sudah tuntas (minimal 4 benar).':'Belum tuntas (perlu minimal 4 benar). Coba ulangi contoh, lalu kerjakan Latihan.'}</p></div>`;
      bar=`<div class="row"><button class="btn ghost" data-act="quizRetry">↺ Ulangi kuis</button><button class="btn primary" data-act="next">Lanjut →</button></div>`;
    } else {
      const q=QUIZ[z.i];
      body=`<span class="tag">Kuis modul · Soal ${z.i+1} dari 5</span><h2>Sederhanakan</h2><div class="card"><div class="mx center" style="font-size:1.75rem">${problemHTML(q)}</div></div>${ansBox(z.input)}${z.fb?fbBox(z.fb.ok,z.fb.ok?z.fb.msg:z.fb.msg+`<br><span class="muted small">Pembahasan: ${solution(q)}</span>`):''}`;
      bar=z.fb?`<button class="btn primary" data-act="quizNext">${z.i<4?'Soal berikutnya →':'Lihat skor →'}</button>`:`${keyboard(z.input)}<button class="btn primary" data-act="quizCheck" ${z.input?'':'disabled'}>Periksa</button>`;
    }
  } else if(L.kind==='reflect'){
    const b=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="paas" data-v="${n}" aria-pressed="${s.paas===n}">${n}</button>`).join('');
    body=`<span class="tag">Refleksi</span><h2>Modul M2 selesai 🎉</h2><div class="card"><p><b>Seberapa berat usaha mentalmu untuk memahami materi ini?</b></p><div class="paas">${b}</div><div class="row small muted"><span>1 = sangat ringan</span><span style="text-align:right">9 = sangat berat</span></div></div>
      <div class="card"><label for="note"><b>Bagian yang masih membingungkan?</b> <span class="muted small">(boleh dikosongkan)</span></label><textarea id="note" class="field" maxlength="300">${esc(s.note)}</textarea></div>`;
    bar=`<button class="btn primary" data-act="finish" ${s.paas?'':'disabled'}>Simpan dan selesai</button>`;
  }
  const showTools=!['quiz','reflect'].includes(L.kind);
  return topbar('Menyederhanakan',[u.li+1,LESSON.length])+`<main><div class="wrap">${body}</div></main>`+actions((showTools?tools:'')+bar);
}

/* ================= Latihan ================= */
function newPrac(level,avoid){ S.prac={level,q:gen(level,avoid),input:'',hints:0,fb:null,ex:gen(level,avoid)}; }
function viewLatihan(){
  const p=S.prac,q=p.q;
  const pr=P.log.filter(e=>e.uid===P.current&&e.area==='latihan'), pb=pr.filter(e=>e.ok).length;
  const seg=['mudah','sedang','sulit'].map(l=>`<button data-act="level" data-l="${l}" aria-pressed="${p.level===l}">${l[0].toUpperCase()+l.slice(1)}</button>`).join('');
  const hintTexts=[
    `Cari kuadrat sempurna terbesar yang membagi ${q.n}. Lihat Tabel kuadrat jika perlu.`,
    `${q.n} = ${q.k*q.k} × ${q.m}, dan ${q.k*q.k} = ${q.k} × ${q.k}.${q.c>1?` Jangan lupa kalikan dengan ${q.c}.`:''}`,
    `Contoh mirip: ${solution(mk(1,p.ex.k,p.ex.m))}`];
  const hints=hintTexts.slice(0,p.hints).map((h,i)=>`<div class="hint"><span class="tag">Petunjuk ${i+1} dari 3</span><div>${h}</div></div>`).join('');
  const body=`<div class="seg" role="group" aria-label="Tingkat kesulitan">${seg}</div>
    <div class="card"><span class="tag">Sederhanakan</span><div class="mx center" style="font-size:1.85rem">${problemHTML(q)}</div></div>
    ${ansBox(p.input)}
    ${!p.fb&&p.hints<3?`<button class="hintbtn" data-act="hint">💡 Butuh petunjuk? (${p.hints}/3)</button>`:''}
    ${hints}
    ${p.fb?fbBox(p.fb.ok,p.fb.ok?p.fb.msg:p.fb.msg+`<br><span class="muted small">Pembahasan: ${solution(q)}</span>`):''}
    <p class="muted small" style="font-variant-numeric:tabular-nums">Hasilmu: ${pb} benar dari ${pr.length} soal. Petunjuk tidak mengurangi nilai.</p>`;
  let bar;
  if(p.fb){
    bar=p.fb.ok?`<button class="btn primary" data-act="pracNext">Soal berikutnya →</button>`
      :`<div class="row"><button class="btn ghost" data-act="pracRetry">Coba lagi</button><button class="btn primary" data-act="pracNext">Coba soal mirip →</button></div>`;
  } else bar=`${keyboard(p.input)}<div class="row"><button class="btn ghost" data-act="sheet" data-tab="tabel" style="flex:0 0 auto" aria-label="Tabel kuadrat">🔢</button><button class="btn primary" data-act="pracCheck" ${p.input?'':'disabled'}>Periksa</button></div>`;
  return topbar('Latihan M2')+`<main><div class="wrap">${body}</div></main>`+actions(bar);
}

/* ================= Pojok Literasi ================= */
function newLit(){ S.lit={step:1,tapped:[],model:null,input:'',fb:null,approx:null,concl:null}; }
function viewLiterasi(){
  const t=S.lit;
  const chip=(id,txt)=>t.step===1?`<button class="chip ${t.tapped.includes(id)?'on':''}" data-act="tap" data-id="${id}" aria-pressed="${t.tapped.includes(id)}">${txt}</button>`:`<b>${txt}</b>`;
  const cyc=['Rumuskan','Kerjakan','Tafsirkan'].map((n,i)=>`<span class="${t.step>i+1?'done':t.step===i+1?'on':''}">${t.step>i+1?'✓ ':''}${i+1}. ${n}</span>`).join('');
  let body=`<div class="cycle" aria-label="Siklus literasi">${cyc}</div>
   <div class="card"><span class="tag">Cerita · Kehidupan sehari-hari</span><p class="stim">Pak Budi punya ubin berbentuk persegi. Luas ubin itu ${chip('a','50 cm²')}.</p><p class="stim">Ia ingin memasukkan ubin ke dalam kotak. Bagian dalam kotak berbentuk persegi dengan sisi ${chip('b','7 cm')}.</p><p class="stim"><b>Apakah ubin bisa masuk ke dalam kotak?</b></p></div>`;
  let bar='';
  if(t.step===1){
    const models=['s = 50 ÷ 4',`s = ${R(50)}`,'s = 50²'];
    const both=t.tapped.length===2;
    body+=`<div class="card"><p><b>Langkah 1 · Rumuskan</b></p><p class="small">Ketuk dua ukuran yang penting pada cerita di atas.</p>
      ${both?`<p class="small">Luas persegi = sisi × sisi. Rumus mana yang tepat untuk mencari sisi ubin?</p><div class="opts">${models.map((m,i)=>`<button class="opt ${t.model===i?(i===1?'sel-ok':'sel-no'):''}" data-act="model" data-o="${i}" ${t.model===1?'disabled':''}>${m}</button>`).join('')}</div>`:''}
      ${t.model!==null?(t.model===1?fbBox(true,'Luas = sisi × sisi. Jadi, sisi = akar dari luas.'):fbBox(false,'Kita mencari bilangan yang jika dikalikan dengan dirinya sendiri hasilnya 50. Itu artinya akar dari 50.')):''}</div>`;
    bar=`<button class="btn primary" data-act="litNext" ${t.model===1?'':'disabled'}>Lanjut ke Kerjakan →</button>`;
  } else if(t.step===2){
    body+=`<div class="card"><p><b>Langkah 2 · Kerjakan</b></p><p class="small">Sederhanakan ${R(50)}.</p></div>${ansBox(t.input)}${t.fb?fbBox(t.fb.ok,t.fb.msg):''}`;
    bar=t.fb&&t.fb.ok?`<button class="btn primary" data-act="litNext">Lanjut ke Tafsirkan →</button>`:`${keyboard(t.input)}<button class="btn primary" data-act="litCheck" ${t.input?'':'disabled'}>Periksa</button>`;
  } else if(t.step===3){
    const ap=[['7,07',true],['7,5',false],['25',false],['5,2',false]];
    const pos=(Math.sqrt(50)-6)/2*100;
    body+=`<div class="card"><p><b>Langkah 3 · Tafsirkan</b></p><p class="small">Sisi ubin = 5${R(2)} cm. Kira-kira berapa cm? (${R(2)} kira-kira 1,414)</p>
      <div class="opts">${ap.map((a,i)=>`<button class="opt ${t.approx===i?(a[1]?'sel-ok':'sel-no'):''}" data-act="approx" data-o="${i}" ${t.approx===0?'disabled':''}>${a[0]} cm</button>`).join('')}</div>
      ${t.approx!==null&&t.approx!==0?fbBox(false,'Hitung 5 × 1,414.'):''}
      ${t.approx===0?`<div class="nl" aria-label="Garis bilangan: 5√2 sekitar 7,07, sedikit di kanan 7"><div class="line"></div>
        ${[6,7,8].map(n=>{const x=(n-6)/2*100;return `<div class="tick" style="left:calc(${x}% - 1px)"></div><div class="lbl" style="left:${x}%">${n}</div>`}).join('')}
        <div class="dot" style="left:${pos}%"></div><div class="dl" style="left:${pos}%">≈ ${approx(Math.sqrt(50))}</div></div>`:''}</div>`;
    if(t.approx===0){
      body+=`<div class="card"><p class="small"><b>Kesimpulan:</b> sisi ubin kira-kira 7,07 cm. Sisi kotak 7 cm. Apakah ubin bisa masuk ke dalam kotak?</p><div class="cmp"><span>Sisi ubin</span><b>7,07 cm</b><span>Sisi kotak</span><b>7 cm</b></div><div class="opts">${['Bisa masuk','Tidak bisa masuk'].map((c,i)=>`<button class="opt ${t.concl===i?(i===1?'sel-ok':'sel-no'):''}" data-act="concl" data-o="${i}" ${t.concl===1?'disabled':''}>${c}</button>`).join('')}</div>
      ${t.concl===1?fbBox(true,'Sisi ubin 7,07 cm lebih besar dari sisi kotak 7 cm. Jadi, ubin tidak bisa masuk. Hasil ini masuk akal, karena 7 × 7 = 49, hampir sama dengan 50.','Tepat, dan masuk akal!'):t.concl===0?fbBox(false,'Bandingkan 7,07 cm dan 7 cm. Ubin hanya bisa masuk jika sisinya sama atau lebih kecil dari sisi kotak.'):''}</div>`;
    }
    bar=`<button class="btn primary" data-act="litDone" ${t.concl===1?'':'disabled'}>Selesai</button>`;
  } else {
    body=`<h2>Pojok Literasi selesai 🌏</h2><div class="card"><p>Kamu sudah memakai bentuk akar untuk masalah nyata:</p><ol class="pola"><li><b>Rumuskan</b>: memilih ukuran yang penting dan rumus s = ${R(50)}</li><li><b>Kerjakan</b>: ${R(50)} = 5${R(2)}</li><li><b>Tafsirkan</b>: 5${R(2)} ≈ 7,07 cm, lebih besar dari 7 cm, jadi ubin tidak bisa masuk ke kotak</li></ol></div><p class="muted small">Versi lengkap memuat cerita lain tentang lapangan, tangga, dan benda jatuh.</p>`;
    bar=`<div class="row"><button class="btn ghost" data-act="litAgain">↺ Ulangi</button><button class="btn primary" data-act="home">Ke beranda</button></div>`;
  }
  return topbar('Pojok Literasi')+`<main><div class="wrap">${body}</div></main>`+actions(bar);
}

/* ================= Paket Soal ================= */
function viewSoal(){
  const ex=S.exam, u=U();
  if(!ex){
    const cards=['mudah','sedang','sulit'].map(l=>{const r=(u.paket||{})[l];
      return `<button class="mcard wide" data-act="examStart" data-l="${l}"><span class="ic">${l==='mudah'?'🟢':l==='sedang'?'🟡':'🔴'}</span><div><b>${LEVEL_INFO[l][0]} · 10 soal</b><span>${LEVEL_INFO[l][1]}</span><span>${r?`Nilai terakhir ${r.last} · Terbaik ${r.best} · Dikerjakan ${r.n}×`:'Belum dikerjakan'}</span></div></button>`}).join('');
    return topbar('Paket Soal')+`<main><div class="wrap">
      <h2>Pilih tingkat soal</h2>
      <p class="muted small">Kerjakan 10 soal. Kamu boleh pindah-pindah soal dan mengganti jawaban. Nilai dan pembahasan muncul setelah kamu menekan <b>Selesai</b>. Tidak ada batas waktu.</p>
      <div class="menu">${cards}</div>
      <p class="muted small">Kartu rumus, tabel kuadrat, dan kalkulator tidak bisa dibuka selama mengerjakan paket soal.</p>
    </div></main>`;
  }
  const qs=BANK[ex.level], name=LEVEL_INFO[ex.level][0];
  if(ex.done){
    const benar=ex.result.filter(Boolean).length, nilai=benar*10;
    const review=qs.map((q,i)=>{
      const a=ex.answers[i], ok=ex.result[i];
      const yours=q.type==='in'?(a?fmtInput(a):'<span class="muted">tidak dijawab</span>'):(a===undefined?'<span class="muted">tidak dijawab</span>':q.options[a]);
      const key=q.type==='in'?CR(q.q.coef,q.q.m):q.options[q.correct];
      const why=q.type==='in'?solution(q.q):q.why;
      return `<div class="card"><div class="vhead"><span class="tag">Soal ${i+1}</span><span class="pill ${ok?'good':'bad'}">${ok?'✓ Benar':'✗ Salah'}</span></div>
        <div>${q.type==='in'?`Sederhanakan <span class="mx" style="font-size:1.25rem">${problemHTML(q.q)}</span>`:q.q}</div>
        <div class="cmp"><span>Jawabanmu</span><b>${yours}</b>${ok?'':`<span>Jawaban benar</span><b>${key}</b>`}</div>
        <p class="small muted">Pembahasan: ${why}</p></div>`}).join('');
    return topbar('Nilai Paket '+name)+`<main><div class="wrap">
      <div class="result"><span class="tag">Nilai paket ${name.toLowerCase()}</span><div class="mx" style="font-size:3rem">${nilai}</div><b>${benar} dari 10 soal benar · ${kategori(nilai)}</b>
        <p class="small muted">${nilai>=70?'Kamu sudah tuntas. Coba tingkat berikutnya!':'Pelajari pembahasan di bawah, lalu coba lagi. Kamu juga bisa mengulang materi di menu Belajar.'}</p></div>
      <h3>Pembahasan</h3>${review}
    </div></main>`+actions(`<div class="row"><button class="btn ghost" data-act="examStart" data-l="${ex.level}">↺ Ulangi paket</button><button class="btn primary" data-act="examMenu">Pilih tingkat lain</button></div>`);
  }
  const q=qs[ex.i], a=ex.answers[ex.i];
  const answered=ex.answers.filter((x,i)=>qs[i].type==='in'?!!x:x!==undefined).length;
  const dots=qs.map((qq,i)=>{const has=qq.type==='in'?!!ex.answers[i]:ex.answers[i]!==undefined;

  const confirm=ex.confirm?`<div class="fb no" role="alert"><b class="h">Masih ada ${10-answered} soal belum dijawab</b><div>Soal yang tidak dijawab dihitung salah. Tetap selesai?</div><div class="row"><button class="btn ghost" data-act="examCancel">Kembali mengerjakan</button><button class="btn primary" data-act="examSubmit" data-force="1">Ya, selesai</button></div></div>`:'';
  const last=ex.i===9;
  const nav=`<div class="row"><button class="btn ghost" data-act="examPrev" ${ex.i===0?'disabled':''}>← Sebelumnya</button>${last?`<button class="btn primary" data-act="examSubmit">Selesai</button>`:`<button class="btn primary" data-act="examNext">Berikutnya →</button>`}</div>`;
  return topbar('Paket '+name,[ex.i+1,10])+`<main><div class="wrap">

    ${!last?`<button class="linkbtn" data-act="examSubmit" style="align-self:flex-start">Selesai dan lihat nilai</button>`:''}

/* ================= Kalkulator Akar ================= */
const toInt=v=>{const n=Number(String(v).trim());return Number.isInteger(n)?n:NaN};
function calcSimplify(aS,nS,bS){
  const a=toInt(aS||1), n=toInt(nS), b=toInt(bS);
  if(!(n>=2&&n<=10)) return {err:'Akar pangkat harus bilangan bulat 2 sampai 10.'};
  if(!(b>=1&&b<=10000000)) return {err:'Angka di dalam akar harus bilangan bulat 1 sampai 10.000.000.'};
  if(!(a>=1&&a<=1000)) return {err:'Angka di depan akar harus bilangan bulat 1 sampai 1.000.'};
  const {k,m,f}=simplifyN(b,n), K=a*k, kn=ipow(k,n);
  const expr=`${a>1?num(a):''}${RI(n,num(b))}`;
  const res=CRN(K,n,m);
  const total=f.reduce((s,[,e])=>s+e,0);
  const flat=b===1?'1':(total<=16?f.map(([p,e])=>Array(e).fill(p).join(' × ')).join(' × '):f.map(([p,e])=>e>1?`${p}<sup>${e}</sup>`:p).join(' × '));
  const steps=[];
  steps.push({mx:`${num(b)} = ${flat}`,why:b===1?'Angka 1 tidak perlu difaktorkan.':(f.length===1&&f[0][1]===1?`${num(b)} adalah bilangan prima, jadi tidak bisa dipecah lagi.`:`Pecah ${num(b)} menjadi perkalian bilangan prima (faktorisasi prima).`)});
  if(total<=24&&b>1){
    const parts=[];
    f.forEach(([p,e])=>{for(let i=0;i<Math.floor(e/n);i++)parts.push(`<span class="grp">(${Array(n).fill(p).join(' × ')})</span>`);for(let j=0;j<e%n;j++)parts.push(p)});
    steps.push({mx:RI(n,parts.join(' × ')),why:`Untuk ${idxName(n)}, buat kelompok berisi ${n} angka yang sama. Angka yang tidak punya kelompok tetap di dalam akar.`});
  }
  const outs=f.flatMap(([p,e])=>Array(Math.floor(e/n)).fill(p));
  if(outs.length){
    steps.push({mx:`= ${H(num(k))}${m>1?RI(n,num(m)):''}`,why:`Setiap kelompok keluar dari akar sebagai satu angka: ${outs.length>1?outs.join(' × ')+' = ':''}${num(k)}. ${m>1?`Sisa ${num(m)} tetap di dalam akar.`:'Tidak ada sisa, jadi akarnya hilang.'}`});
    if(a>1) steps.push({mx:`${num(a)} × ${CRN(k,n,m)} = ${H(res)}`,why:'Kalikan dengan angka di depan akar.'});
  } else {
    steps.push({mx:`${expr} = ${H(res)}`,why:b===1?'Akar dari 1 selalu 1, karena 1 dikali 1 berapa kali pun tetap 1.':`Tidak ada kelompok berisi ${n} angka yang sama, jadi tidak ada angka yang bisa keluar. Bentuk ini sudah paling sederhana.`});
  }
  const r=iroot(b,n), perfect=ipow(r,n)===b;
  const info=[
    ['Nilai desimal',`${expr} ${perfect?'=':'≈'} ${dec(a*Math.pow(b,1/n))}`],
    ['Letak di garis bilangan',perfect?`${RI(n,num(b))} tepat ${num(r)}, karena ${num(r)}${supN(n)} = ${num(b)}`:`${RI(n,num(b))} ada di antara ${num(r)} dan ${num(r+1)}, karena ${num(r)}${supN(n)} = ${num(ipow(r,n))} dan ${num(r+1)}${supN(n)} = ${num(ipow(r+1,n))}`],
    ['Bilangan '+perfName(n)+'?',perfect?`Ya, ${num(b)} = ${num(r)}${supN(n)}`:`Bukan, ${num(b)} bukan bilangan ${perfName(n)}`],
    ['Bentuk pangkat pecahan',`${a>1?num(a)+' × ':''}${num(b)}<sup>1/${n}</sup>`]];
  if(k>1&&m>1) info.splice(1,0,['Cara cepat',`${num(b)} = ${H(num(kn))} × ${num(m)}, dan ${num(kn)} = ${num(k)}${supN(n)} adalah bilangan ${perfName(n)} terbesar yang membagi ${num(b)}`]);
  if(a===1&&k>1&&m>1) info.push(['Cek balik',`(${res})${supN(n)} = ${num(k)}${supN(n)} × ${num(m)} = ${num(kn)} × ${num(m)} = ${num(b)} ✓`]);
  return {expr,res,steps,info};
}
function calcOp(o){
  const a1=toInt(o.a1||1),b1=toInt(o.b1),a2=toInt(o.a2||1),b2=toInt(o.b2),op=o.op;
  if(![a1,a2].every(x=>x>=1&&x<=1000)) return {err:'Angka di depan akar harus bilangan bulat 1 sampai 1.000.'};
  if(![b1,b2].every(x=>x>=1&&x<=100000)) return {err:'Angka di dalam akar harus bilangan bulat 1 sampai 100.000.'};
  const expr=`${CR(a1,b1)} ${op} ${CR(a2,b2)}`;
  const s1=simplifyN(b1,2),s2=simplifyN(b2,2),A=a1*s1.k,B=a2*s2.k,m1=s1.m,m2=s2.m;
  const steps=[]; let res, info=[];
  const v1=a1*Math.sqrt(b1), v2=a2*Math.sqrt(b2);
  if(op==='+'||op==='−'){
    if(s1.k>1||s2.k>1) steps.push({mx:`${expr} = ${CR(A,m1)} ${op} ${CR(B,m2)}`,why:'Sederhanakan dulu masing-masing bentuk akar.'});
    if(m1===m2){
      const C=op==='+'?A+B:A-B; res=CRs(C,m1);
      steps.push({mx:`= (${num(A)} ${op} ${num(B)})${m1>1?R(num(m1)):''} = ${H(res)}`,why:m1>1?'Angka di dalam akar sama (sejenis), jadi cukup hitung angka di depannya.':'Keduanya bilangan bulat, jadi langsung dihitung.'});
    } else {
      res=`${CR(A,m1)} ${op} ${CR(B,m2)}`;
      steps.push({mx:`= ${H(res)}`,why:'Angka di dalam akar berbeda (tidak sejenis), jadi tidak bisa digabung menjadi satu bentuk akar.'});
    }
    if(op==='+') info.push(['Hati-hati',`${R('a')} + ${R('b')} tidak sama dengan ${R('a + b')}. Contoh: ${R(9)} + ${R(16)} = 3 + 4 = 7, sedangkan ${R(25)} = 5.`]);
    info.unshift(['Nilai desimal',`≈ ${dec(op==='+'?v1+v2:v1-v2)}`]);
  } else if(op==='×'){
    const P2=b1*b2, s=simplifyN(P2,2), C=a1*a2*s.k; res=CR(C,s.m);
    steps.push({mx:`${expr} = (${num(a1)} × ${num(a2)})${R(num(b1)+' × '+num(b2))} = ${CR(a1*a2,P2)}`,why:'Kalikan angka di luar akar dengan di luar, angka di dalam akar dengan di dalam.'});
    if(s.k>1) steps.push({mx:`= ${num(a1*a2)} × ${R(H(num(s.k*s.k))+' × '+num(s.m))} = ${H(res)}`,why:`${num(s.k*s.k)} adalah kuadrat sempurna terbesar yang membagi ${num(P2)}.`});
    info.push(['Nilai desimal',`≈ ${dec(v1*v2)}`]);
  } else {
    if(b1%b2===0){
      const q=b1/b2, s=simplifyN(q,2);
      steps.push({mx:`${expr} = ${FR(num(a1),num(a2))} × ${R(num(b1)+' ÷ '+num(b2))} = ${FR(num(a1),num(a2))} × ${R(num(q))}`,why:'Bagi angka di luar dengan di luar, angka di dalam akar dengan di dalam.'});
      res=fracRad(a1*s.k,a2,s.m);
      steps.push({mx:`= ${H(res)}`,why:s.k>1?`Sederhanakan ${R(num(q))} = ${CR(s.k,s.m)}, lalu sederhanakan pecahannya.`:'Sederhanakan pecahannya jika bisa.'});
    } else {
      const s=simplifyN(b1*b2,2);
      steps.push({mx:`${expr} = ${FR(CR(a1,b1),CR(a2,b2))} × ${FR(R(num(b2)),R(num(b2)))}`,why:`Agar penyebut tidak mengandung akar, kalikan pembilang dan penyebut dengan ${R(num(b2))}.`});
      steps.push({mx:`= ${FR(CR(a1,b1*b2),num(a2*b2))}`,why:`${R(num(b2))} × ${R(num(b2))} = ${num(b2)}.`});
      res=fracRad(a1*s.k,a2*b2,s.m);
      steps.push({mx:`= ${H(res)}`,why:'Sederhanakan bentuk akar dan pecahannya.'});
    }
    info.push(['Nilai desimal',`≈ ${dec(v1/v2)}`]);
  }
  return {expr,res,steps,info};
}
function calcRas(r){
  const steps=[],info=[];
  if(r.form==='A'){
    const a=toInt(r.a),c=toInt(r.c||1),d=toInt(r.d);
    if(!(a>=1&&a<=100000)) return {err:'Pembilang harus bilangan bulat 1 sampai 100.000.'};
    if(!(c>=1&&c<=1000)) return {err:'Angka di depan akar harus bilangan bulat 1 sampai 1.000.'};
    if(!(d>=2&&d<=100000)) return {err:'Angka di dalam akar harus bilangan bulat 2 sampai 100.000.'};
    const expr=FR(num(a),CR(c,d));
    const s=simplifyN(d,2),c2=c*s.k,m=s.m;
    if(s.k>1) steps.push({mx:`${expr} = ${FR(num(a),CR(c2,m))}`,why:`Sederhanakan dulu akar di penyebut: ${R(num(d))} = ${CR(s.k,m)}.`});
    if(m===1){
      const res=fracRad(a,c2,1);
      steps.push({mx:`= ${H(res)}`,why:'Akar di penyebut ternyata bilangan bulat, jadi penyebut sudah rasional.'});
      return {expr,res,steps,info:[['Nilai desimal',`≈ ${dec(a/(c*Math.sqrt(d)))}`]]};
    }
    steps.push({mx:`${FR(num(a),CR(c2,m))} × ${FR(R(num(m)),R(num(m)))}`,why:`Kalikan pembilang dan penyebut dengan ${R(num(m))}. Ini sama dengan mengalikan 1, jadi nilainya tidak berubah.`});
    steps.push({mx:`= ${FR(CR(a,m),num(c2*m))}`,why:`${R(num(m))} × ${R(num(m))} = ${num(m)}, jadi penyebutnya ${c2>1?num(c2)+' × '+num(m)+' = ':''}${num(c2*m)}.`});
    const res=fracRad(a,c2*m,m);
    steps.push({mx:`= ${H(res)}`,why:gcd(a,c2*m)>1?`Bagi pembilang dan penyebut dengan ${num(gcd(a,c2*m))}.`:'Pecahan ini sudah paling sederhana.'});
    info.push(['Nilai desimal',`≈ ${dec(a/(c*Math.sqrt(d)))}`],['Mengapa dirasionalkan?','Bentuk akar di penyebut dianggap belum sederhana. Setelah dirasionalkan, penyebutnya bilangan bulat.']);
    return {expr,res,steps,info};
  }
  const a=toInt(r.a),b=toInt(r.b),t=toInt(r.t||1),c=toInt(r.rc),sg=r.sign;
  if(!(a>=1&&a<=100000)) return {err:'Pembilang harus bilangan bulat 1 sampai 100.000.'};
  if(!(b>=0&&b<=1000)) return {err:'Angka pertama di penyebut harus bilangan bulat 0 sampai 1.000.'};
  if(!(t>=1&&t<=100)) return {err:'Angka di depan akar harus bilangan bulat 1 sampai 100.'};
  if(!(c>=2&&c<=10000)) return {err:'Angka di dalam akar harus bilangan bulat 2 sampai 10.000.'};
  const den=`${num(b)} ${sg} ${CR(t,c)}`, expr=FR(num(a),den);
  const s=simplifyN(c,2),t2=t*s.k,m=s.m, den2=`${num(b)} ${sg} ${CR(t2,m)}`;
  const val=a/(b+(sg==='+'?1:-1)*t*Math.sqrt(c));
  if(s.k>1) steps.push({mx:`${expr} = ${FR(num(a),den2)}`,why:`Sederhanakan dulu akar di penyebut: ${CR(t,c)} = ${CR(t2,m)}.`});
  if(m===1){
    const Dv=sg==='+'?b+t2:b-t2;
    if(Dv===0) return {err:'Penyebutnya menjadi 0, jadi pecahan ini tidak punya nilai.'};
    const res=fracRad(a,Dv,1);
    steps.push({mx:`= ${FR(num(a),num(Dv))} = ${H(res)}`,why:'Akar di penyebut ternyata bilangan bulat, jadi langsung dihitung.'});
    return {expr,res,steps,info:[['Nilai desimal',`≈ ${dec(val)}`]]};
  }
  const cs=sg==='+'?'−':'+', conj=`${num(b)} ${cs} ${CR(t2,m)}`;
  const D=b*b-t2*t2*m;
  if(D===0) return {err:'Penyebutnya menjadi 0, jadi pecahan ini tidak punya nilai.'};
  steps.push({mx:`Sekawan dari ${den2} adalah ${H(conj)}`,why:'Bentuk sekawan didapat dengan mengganti tanda di tengah saja.'});
  steps.push({mx:`${FR(num(a),den2)} × ${FR(conj,conj)}`,why:'Kalikan pembilang dan penyebut dengan sekawannya. Ini sama dengan mengalikan 1.'});
  steps.push({mx:`Penyebut: ${num(b)}² − (${CR(t2,m)})² = ${num(b*b)} − ${num(t2*t2*m)} = ${num(D)}`,why:'Pakai pola (x + y)(x − y) = x² − y². Akarnya hilang dari penyebut.'});
  let Pn=a*b, Q=(cs==='−'?-1:1)*a*t2;
  steps.push({mx:`Pembilang: ${num(a)} × (${conj}) = ${b?num(Pn)+' '+cs+' ':''}${b?CR(a*t2,m):(cs==='−'?'−':'')+CR(a*t2,m)}`,why:'Kalikan pembilang ke setiap bagian di dalam kurung.'});
  let Dn=D; if(Dn<0){Pn=-Pn;Q=-Q;Dn=-Dn}
  const g=gcd(gcd(Pn,Q),Dn)||1; Pn/=g;Q/=g;Dn/=g;
  const top=(Pn!==0?num(Pn):'')+(Pn!==0?(Q<0?' − ':' + ')+CR(Math.abs(Q),m):(Q<0?'−':'')+CR(Math.abs(Q),m));
  const res=Dn===1?top:FR(top,num(Dn));
  steps.push({mx:`= ${H(res)}`,why:g>1?`Gabungkan, lalu bagi semua angka dengan ${num(g)}.`:(D<0?'Gabungkan. Tanda negatif di penyebut dipindah ke pembilang.':'Gabungkan pembilang dan penyebutnya.')});
  info.push(['Nilai desimal',`≈ ${dec(val)}`],['Ingat','(x + y)(x − y) = x² − y². Karena itu sekawan selalu menghilangkan akar di penyebut.']);
  return {expr,res,steps,info};
}
function calcPreview(){
  const c=S.calc;
  if(c.tab==='sederhana'){const a=toInt(c.s.a||1),n=toInt(c.s.n)||2;return `${a>1?num(a):''}${RI(n>=2&&n<=10?n:2,c.s.b===''?'&nbsp;?&nbsp;':esc(c.s.b))}`}
  if(c.tab==='operasi'){const o=c.o,f=(a,b)=>`${toInt(a||1)>1?esc(a):''}${R(b===''?'?':esc(b))}`;return `${f(o.a1,o.b1)} ${o.op} ${f(o.a2,o.b2)}`}
  const r=c.r; const ce=(t,x)=>`${toInt(t||1)>1?esc(t):''}${R(x===''?'?':esc(x))}`;
  return r.form==='A'?FR(esc(r.a||'?'),ce(r.c,r.d)):FR(esc(r.a||'?'),`${esc(r.b||'?')} ${r.sign} ${ce(r.t,r.rc)}`);
}

      :`<div class="inputs">${inp('r_a','Pembilang (a)',c.r.a,'min="1"')}${inp('r_b','Angka penyebut (b)',c.r.b,'min="0"')}</div>
        <div class="seg" style="grid-template-columns:1fr 1fr" role="group" aria-label="Tanda"><button data-act="csign" data-s="+" aria-pressed="${c.r.sign==='+'}">b + t√c</button><button data-act="csign" data-s="−" aria-pressed="${c.r.sign==='−'}">b − t√c</button></div>

const AREA={kunjungan:'Kunjungan',contoh:'Belajar',kuis:'Kuis','kuis-selesai':'Nilai kuis',latihan:'Latihan',literasi:'Literasi',refleksi:'Refleksi',kalkulator:'Kalkulator','paket-mulai':'Mulai paket soal',paket:'Paket soal','paket-selesai':'Nilai paket soal'};

/* Ubah baris-baris Google Sheets menjadi data pengunjung yang sama bentuknya dengan data lokal */
function buildDataset(rows){
  const users={},log=[],seen=new Set();
  (rows||[]).forEach(r=>{
    if(!r||!r.uid||seen.has(r.id)) return; seen.add(r.id);
    const t=+new Date(r.waktu)||0;
    const ev={uid:String(r.uid),t,area:String(r.kegiatan||''),q:String(r.soal??''),ans:String(r.jawaban??''),ok:r.hasil==='benar'?true:r.hasil==='salah'?false:null};
    if(r.petunjuk) ev.hint=+r.petunjuk||0; if(r.catatan) ev.note=String(r.catatan);
    log.push(ev);
    const u=users[ev.uid]||(users[ev.uid]={name:'Tanpa nama',code:'',created:t,lastSeen:t,paket:{},litDone:false,paas:null});
    if(r.nama) u.name=String(r.nama); if(r.kode) u.code=String(r.kode);
  });
  log.sort((a,b)=>a.t-b.t);
  log.forEach(e=>{
    const u=users[e.uid]; u.created=Math.min(u.created,e.t); u.lastSeen=Math.max(u.lastSeen,e.t);
    if(e.area==='paket-selesai'){const l=/mudah/i.test(e.q)?'mudah':/sedang/i.test(e.q)?'sedang':'sulit';const v=+e.ans||0;const p=u.paket[l];u.paket[l]={last:v,best:Math.max(p?p.best:0,v),n:(p?p.n:0)+1};}
    if(e.area==='literasi'&&e.q.startsWith('Kesimpulan')&&e.ok) u.litDone=true;
    if(e.area==='refleksi') u.paas=+e.ans||null;
  });
  return {users,log};
}
async function fetchOnline(silent){

  try{
    await flush();

    if(!j||!j.ok){ if(!silent) o.onlineErr=j&&j.error==='key'?'Kunci rahasia salah.':'Data tidak bisa diambil. Coba lagi.'; }
    else { o.online=buildDataset(j.events); o.fetchedAt=Date.now(); o.onlineErr=''; try{localStorage.setItem(KEYK,key)}catch(_){} }
  }catch(_){ if(!silent) o.onlineErr='Tidak bisa terhubung ke Google Sheets. Periksa internet, lalu coba lagi.'; }

}

function exportMine(){
  const u=U(); if(!u) return null;
  return JSON.stringify({app:'akarku',v:1,exportedAt:new Date().toISOString(),users:{[P.current]:u},log:P.log.filter(e=>e.uid===P.current)});
}
function mergeData(text){
  let d; try{ d=JSON.parse(String(text).trim()) }catch(_){ return {err:'Isi file/teks tidak dikenali. Pastikan itu file hasil dari tombol “Simpan file hasilku”.'} }
  if(!d||d.app!=='akarku'||typeof d.users!=='object'||!Array.isArray(d.log)) return {err:'Ini bukan file hasil AkarKu.'};
  let nu=0,ne=0;
  for(const [id,src] of Object.entries(d.users)){
    if(!src||typeof src.name!=='string'||!/^[A-Za-z0-9]+$/.test(id)) continue;
    const clean={name:String(src.name).slice(0,20),code:String(src.code||'').slice(0,12),created:+src.created||Date.now(),lastSeen:+src.lastSeen||0,
      li:0,lessonDone:!!src.lessonDone,quizScore:src.quizScore??null,quizBest:src.quizBest??null,litDone:!!src.litDone,paas:src.paas??null,paket:{},imported:true};
    if(src.paket&&typeof src.paket==='object') for(const l of ['mudah','sedang','sulit']){const r=src.paket[l]; if(r) clean.paket[l]={last:+r.last||0,best:+r.best||0,n:+r.n||1};}
    const cur=P.users[id];
    if(!cur){ P.users[id]=clean; nu++; }
    else if(cur.imported||id!==P.current){
      if((clean.lastSeen||0)>=(cur.lastSeen||0)) Object.assign(cur,clean,{imported:cur.imported});
    }
  }
  const seen=new Set(P.log.map(e=>e.uid+'|'+e.t+'|'+e.area+'|'+e.q));
  for(const e of d.log){
    if(!e||!d.users[e.uid]||!P.users[e.uid]) continue;
    const ev={uid:e.uid,t:+e.t||0,area:String(e.area||'').slice(0,20),q:String(e.q||'').slice(0,300),ans:String(e.ans??'').slice(0,300),ok:e.ok===true?true:e.ok===false?false:null};
    if(e.hint) ev.hint=+e.hint||0; if(e.note) ev.note=String(e.note).slice(0,300);
    const key=ev.uid+'|'+ev.t+'|'+ev.area+'|'+ev.q; if(seen.has(key)) continue;
    seen.add(key); P.log.push(ev); ne++;
  }
  P.log.sort((a,b)=>a.t-b.t);
  save();
  return {nu,ne,names:Object.values(d.users).map(u=>u&&u.name).filter(Boolean)};
}

function sqGrid(){
  let a=parseInt(S.sq.from,10),b=parseInt(S.sq.to,10);
  if(!(a>=1)||!(b>=1)) return '<p class="small muted">Isi kedua kotak dengan angka 1 sampai 1.000.</p>';
  a=Math.min(a,1000);b=Math.min(b,1000); if(a>b){const t=a;a=b;b=t}
  let note=''; if(b-a+1>50){b=a+49;note=`<p class="small muted">Ditampilkan 50 angka pertama: ${a} sampai ${b}.</p>`}
  const cells=[]; for(let i=a;i<=b;i++) cells.push(`<div><span class="muted">${num(i)}²</span><b>${num(i*i)}</b></div>`);
  return note+`<div class="sq">${cells.join('')}</div>`;
}
function sqOne(){
  const v=S.sq.one; if(v===''||v==null) return '<span class="muted small" style="font-weight:400">Hasilnya muncul di sini.</span>';
  const n=parseInt(v,10); if(!(n>=0)||n>100000) return '<span class="muted small" style="font-weight:400">Ketik angka 0 sampai 100.000.</span>';
  return `${num(n)} × ${num(n)} = ${num(n*n)}`;
}

function typeKey(obj,k){

    case 'pinEnter': { const o=S.owner; if(o.pinDraft===P.pin){o.unlocked=true;o.msg='';o.pinDraft='';if(SYNC_ON&&o.key&&o.src==='online') setTimeout(fetchOnline,0)}else{o.msg='PIN salah.';o.pinDraft=''} render(); break; }
    case 'lock': Object.assign(S.owner,{unlocked:false,open:{},confirmDel:false,msg:'',csv:null,online:null,onlineErr:''}); go('beranda'); break;
    case 'osrc': S.owner.src=el.dataset.s; S.owner.open={}; S.owner.msg=''; S.owner.csv=null; render(); if(S.owner.src==='online'&&!S.owner.online&&S.owner.key) fetchOnline(); break;
    case 'ofetch': fetchOnline(); break;
    case 'otoggle': { const id=el.dataset.id; S.owner.open[id]=!S.owner.open[id]; render(); break; }
    case 'csv': saveCsv(el.dataset.k); break;
    case 'copyCsv': { const box=document.getElementById('csvBox'); const txt=S.owner.csv||'';
      const fallback=()=>{ if(box){box.focus();box.select()} S.owner.msg='Teks sudah dipilih. Tekan lama lalu pilih Salin.'; };
      try{ navigator.clipboard.writeText(txt).then(()=>{S.owner.msg='✓ Teks CSV disalin.';render()},()=>{fallback()}) }catch(_){ fallback() } break; }
    case 'shareMine': shareMine(); break;
    case 'sharePdf': studentPdf(); break;
    case 'ownerPdf': ownerPdf(); break;
    case 'copyShare': { const box=document.getElementById('shareBox'); const txt=(S.share&&S.share.text)||'';
      const fb=()=>{ if(box){box.focus();box.select()} S.share.msg='Teks sudah dipilih. Tekan lama lalu pilih Salin.'; };
      try{ navigator.clipboard.writeText(txt).then(()=>{S.share.msg='✓ Teks hasil disalin. Tempel di WhatsApp lalu kirim ke guru.';render()},fb) }catch(_){ fb() } break; }
    case 'importPaste': { const o=S.owner; const t=(o.importText||'').trim(); if(!t){o.importMsg='Tempel dulu teks hasil siswa.';render();return}
      const r=mergeData(t); o.importMsg=r.err?`<span class="err">${r.err}</span>`:`✓ Digabungkan: ${esc(r.names.join(', '))}. ${r.nu} siswa baru, ${r.ne} aktivitas ditambahkan.`;
      if(!r.err) o.importText=''; render(); break; }
    case 'delAsk': S.owner.confirmDel=true; render(); break;
    case 'delNo': S.owner.confirmDel=false; render(); break;
    case 'delYes': P.users={}; P.log=[]; P.current=null; S.owner.confirmDel=false; S.owner.open={}; S.owner.msg='Semua data sudah dihapus.'; save(); render(); break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const map={nick:'start',code:'start',pin1:null,pin2:null};
    if(e.target.id in map){ e.preventDefault(); const b=document.querySelector(e.target.id.startsWith('pin')?'[data-act="pinCreate"],[data-act="pinEnter"]':'[data-act="start"]'); if(b) b.click(); }
    if(/^(c_|o_|r_)/.test(e.target.id)){ e.preventDefault(); const b=document.querySelector('[data-act="calc"]'); if(b) b.click(); }
  }
  if(e.key==='Escape'&&S.sheet){ S.sheet=null; renderSheet(); }
});

/* Mulai */
(function init(){
  if(P.current&&!P.users[P.current]) P.current=null;
  if(P.current){ P.users[P.current].lastSeen=Date.now(); logEv('kunjungan','Membuka aplikasi','',null); }
  const v=location.hash.slice(1);
  S.view=VIEWS.includes(v)?v:'beranda';
  if(['belajar','latihan','literasi','soal'].includes(S.view)&&!P.current) S.view='beranda';
  if(S.view==='latihan') newPrac('mudah');
  if(S.view==='literasi') newLit();
  resetScr();
  render();
  flush();
})();
</script>
