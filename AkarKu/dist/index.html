<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8061C9">
<title>AkarKu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: aplikasi satu kolom mobile-first (maks 560px). Kartu membulat berwarna pastel, menu bawah gelap berbentuk pil.
   Palet: ungu, lavender, biru, kuning, cream. Satu tampilan terang yang konsisten. */
:root{
  --ungu:#8061C9; --ungu-tua:#5B3FA3; --lavender:#BCA5F5; --lav-soft:#EFE8FF;
  --biru:#8BC5F5; --biru-soft:#E4F2FE; --kuning:#FFE18A; --kun-soft:#FFF5D1; --cream:#FFF9F0;
  --bg:#F6F2FD; --surface:#FFFFFF; --ink:#221C35; --muted:#6E6787; --line:#E8E2F4; --dark:#1F1A2E;
  --accent:#C2410C; --success:#157A3C; --success-bg:#E8F6EC; --danger:#C0352B; --danger-bg:#FDECEA;
  --hint:#FFF5D1; --hint-ink:#6B4E00;
  --font:'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r:22px; --shadow:0 6px 22px rgba(80,50,140,.09);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1.0625rem;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
button,a.btn{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ungu);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h2{font-size:1.45rem;font-weight:900;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:1.0625rem;font-weight:800;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.9375rem}
.tag{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ungu-tua)}

/* TopBar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:64px}
.circ{width:48px;height:48px;flex:0 0 48px;border:0;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:1.3rem;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.circ:active{transform:scale(.95)}
.top h1{font-size:1.2rem;font-weight:900;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.bar{width:70px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ungu);border-radius:4px}

main{flex:1;padding-block:8px 28px}
main .wrap{display:flex;flex-direction:column;gap:16px}
main.has-nav{padding-bottom:120px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.t-lav{background:var(--lav-soft)} .t-biru{background:var(--biru-soft)} .t-kun{background:var(--kun-soft)} .t-cream{background:var(--cream)}
.t-ungu{background:var(--ungu);color:#fff} .t-ungu .muted,.t-ungu .tag{color:#F1EBFF}
.mx{font-size:1.4rem;font-weight:700;overflow-x:auto;padding:6px 0;white-space:nowrap}
.mx.center{text-align:center}
.hl{color:var(--accent);font-weight:900;background:transparent}
.ill{display:block;width:100%;max-width:300px;height:auto;margin:0 auto}
.ill text{font-family:var(--font)}

/* Bentuk akar & pecahan */
.rad{display:inline-flex;align-items:flex-start;white-space:nowrap;vertical-align:baseline}
.rad .s{line-height:1.15;padding-right:1px}
.rad .b{border-top:2px solid currentColor;line-height:1.15;padding:0 3px;margin-top:.14em}
.rad .idx{font-size:.58em;line-height:1;margin-right:-.3em;position:relative;top:-.05em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px}
.frac .fn{border-bottom:2px solid currentColor;padding:0 4px 2px;line-height:1.3}
.frac .fd{padding:2px 4px 0;line-height:1.3}
.grp{color:var(--accent);font-weight:900}

/* Langkah */
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;flex-direction:column;gap:2px;min-width:0;padding-left:14px;border-left:3px solid var(--lavender)}
.step.past{opacity:.6}
.step .why{font-size:.9375rem;color:var(--muted)}
.step .no{font-size:.72rem;font-weight:900;color:var(--ungu);letter-spacing:.06em}

/* Pilihan */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:54px;text-align:left;padding:10px 16px;border:2px solid var(--line);border-radius:18px;background:var(--surface);cursor:pointer;font-size:1.0625rem;font-weight:600;touch-action:manipulation}
.opt:active{background:var(--lav-soft)}
.opt.sel{border-color:var(--ungu);background:var(--lav-soft);font-weight:800}
.opt.sel-ok{border-color:var(--success);background:var(--success-bg)}
.opt.sel-no{border-color:var(--danger);background:var(--danger-bg)}
.opt[disabled]{cursor:default}

/* Umpan balik */
.fb{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.fb.ok{background:var(--success-bg)} .fb.no{background:var(--danger-bg)}
.fb b.h{font-size:1.0625rem}
.fb.ok b.h{color:var(--success)} .fb.no b.h{color:var(--danger)}
.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}

/* Petunjuk */
.hintbtn{align-self:flex-start;min-height:46px;padding:0 16px;border:0;border-radius:999px;background:var(--kun-soft);cursor:pointer;color:var(--hint-ink);font-weight:800}
.hint{background:var(--hint);color:var(--hint-ink);border-radius:18px;padding:12px 16px;font-size:.9375rem}
.hint .tag{color:inherit;opacity:.85}

/* Jawaban & papan ketik */
.ans{min-height:64px;border:2.5px solid var(--ungu);border-radius:20px;background:var(--surface);display:flex;align-items:center;padding:0 18px;font-size:1.55rem;font-weight:800;overflow-x:auto;white-space:nowrap}
.ans .ph{color:var(--muted);font-size:1rem;font-weight:600}
.ans .caret{display:inline-block;width:2px;height:1.4em;background:var(--ungu);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{min-height:52px;border:0;border-radius:16px;background:var(--surface);box-shadow:0 2px 0 var(--line);font-size:1.3rem;font-weight:800;cursor:pointer;touch-action:manipulation}
.key:active{transform:translateY(1px);box-shadow:none}
.key.fn{font-size:1rem;color:var(--muted);background:var(--lav-soft)}
.key.rt{background:var(--ungu);color:#fff}
.key[disabled]{opacity:.35}

/* Bilah aksi bawah */
.actions{position:sticky;bottom:0;z-index:4;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.actions .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.row{display:flex;gap:10px}
.row > *{flex:1;min-width:0}
.btn{min-height:54px;border-radius:999px;border:0;font-weight:800;font-size:1.0625rem;cursor:pointer;touch-action:manipulation;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-sizing:border-box}
.btn.primary{background:var(--dark);color:#fff}
.btn.ungu{background:var(--ungu);color:#fff}
.btn.ghost{background:var(--surface);box-shadow:var(--shadow)}
.btn.danger{background:var(--danger);color:#fff}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:default}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{min-height:44px;padding:0 14px;border:0;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:.9375rem;font-weight:800;cursor:pointer;color:var(--ungu-tua)}
.tool[aria-pressed="true"]{background:var(--ungu);color:#fff}
.linkbtn{border:0;background:transparent;color:var(--ungu-tua);font-weight:800;cursor:pointer;min-height:44px;padding:0 4px;text-decoration:underline;align-self:flex-start}

/* Onboarding */
.welcome{background:var(--lavender);border-radius:0 0 36px 36px;padding-block:20px 26px;margin-bottom:4px}
.welcome .wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.wcard{background:var(--surface);border-radius:20px;padding:14px 22px;transform:rotate(-4deg);box-shadow:0 10px 24px rgba(60,30,120,.18);text-align:center;margin-top:6px}
.wcard b{display:block;font-size:1.85rem;font-weight:900;line-height:1.1}
.wcard mark{background:var(--kuning);padding:0 6px;border-radius:6px;color:var(--ink)}
.field{min-height:54px;width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:18px;background:var(--surface);padding:0 16px;font-size:1rem;font-family:inherit;color:var(--ink)}
textarea.field{min-height:84px;padding:12px 16px;resize:vertical}
.flabel{display:flex;flex-direction:column;gap:6px;font-weight:800}
.note{font-size:.875rem;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-start}

/* Beranda */
.hello{display:flex;align-items:center;gap:12px;padding-top:8px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--lav-soft);display:grid;place-items:center;overflow:hidden;flex:0 0 56px;border:3px solid var(--surface);box-shadow:var(--shadow)}
.avatar svg{width:50px;height:50px}
.hello > div{flex:1;min-width:0}
.hello b{font-size:1.25rem;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:var(--lavender);border-radius:28px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;overflow:hidden;position:relative}
.hero h2{font-size:1.5rem}
.hero mark{background:var(--kuning);padding:0 6px;border-radius:6px;color:var(--ink)}
.hero .mas{width:118px;height:118px}
.hero .btn{min-height:46px;align-self:start;justify-self:start;margin-top:6px}
.sec{display:flex;justify-content:space-between;align-items:baseline}
.sec h3{font-size:1.15rem;font-weight:900}
.act{display:grid;grid-template-columns:108px 1fr auto;gap:14px;align-items:center;border-radius:26px;padding:12px;border:0;cursor:pointer;text-align:left;width:100%;touch-action:manipulation}
.act .pic{width:108px;height:96px;border-radius:20px;background:rgba(255,255,255,.55);display:grid;place-items:center}
.act .pic svg{width:72px;height:72px}
.act b.title{font-size:1.0625rem;font-weight:900;display:block}
.act .big{font-size:2rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.act .unit{font-size:.875rem;color:var(--muted);font-weight:700}
.go{width:44px;height:44px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:1.1rem;align-self:end}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:24px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:132px;position:relative;touch-action:manipulation;min-width:0}
.tile svg.ico{width:46px;height:46px}
.tile b{font-size:1.0625rem;font-weight:900}
.tile span{font-size:.85rem;color:var(--muted);font-weight:600}
.tile .arr{position:absolute;top:12px;right:14px;font-weight:900;color:var(--ungu-tua)}
.tile:active,.act:active{transform:scale(.98)}

/* Menu bawah */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bnav-in{pointer-events:auto;margin:0 auto;width:max-content;max-width:calc(100% - 24px);background:var(--dark);border-radius:999px;padding:6px;display:flex;gap:4px;box-shadow:0 10px 30px rgba(31,26,46,.35)}
.bn{width:56px;height:56px;border:0;border-radius:50%;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.bn svg{width:24px;height:24px}
.bn span{display:none}
.bn.on{background:var(--lavender);color:var(--dark)}

/* Segmen */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
.seg button{min-height:44px;border:0;border-radius:999px;background:transparent;font-weight:800;cursor:pointer;font-size:.9375rem}
.seg button[aria-pressed="true"]{background:var(--ungu);color:#fff}

/* Literasi */
.stim{font-size:1.0625rem}
.chip{display:inline-block;min-height:36px;padding:2px 10px;margin:2px 0;border:2px dashed var(--ungu);border-radius:10px;background:transparent;font-weight:900;cursor:pointer;color:var(--ink)}
.chip.on{border-style:solid;background:var(--ungu);color:#fff}
.cycle{display:flex;gap:6px}
.cycle span{flex:1;text-align:center;font-size:.8125rem;font-weight:800;padding:8px 4px;border-radius:999px;background:var(--surface);color:var(--muted)}
.cycle span.on{background:var(--ungu);color:#fff}
.cycle span.done{background:var(--success-bg);color:var(--success)}
.nl{position:relative;height:56px;margin:4px 8px 0}
.nl .line{position:absolute;left:0;right:0;top:18px;height:3px;background:var(--lavender);border-radius:2px}
.nl .tick{position:absolute;top:12px;width:2px;height:14px;background:var(--muted)}
.nl .lbl{position:absolute;top:30px;transform:translateX(-50%);font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nl .dot{position:absolute;top:10px;width:18px;height:18px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.nl .dl{position:absolute;top:-12px;transform:translateX(-50%);font-size:.8125rem;font-weight:900;color:var(--accent);white-space:nowrap}
.cmp{display:grid;grid-template-columns:auto auto;justify-content:start;gap:6px 22px;padding:12px 16px;border-radius:16px;background:var(--cream);font-variant-numeric:tabular-nums}
.cmp b{font-size:1.125rem}

/* Refleksi */
.paas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.paas button{min-height:50px;border:0;border-radius:16px;background:var(--lav-soft);font-weight:900;cursor:pointer}
.paas button[aria-pressed="true"]{background:var(--ungu);color:#fff}
ol.pola{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}

/* Paket soal */
.qdots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qdot{min-height:46px;border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-weight:900;cursor:pointer;font-variant-numeric:tabular-nums}
.qdot.has{background:var(--lavender)}
.qdot.cur{outline:3px solid var(--ungu);outline-offset:2px}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border:0;border-radius:24px;padding:16px;cursor:pointer;text-align:left;width:100%}
.lvl .badge{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.65);display:grid;place-items:center;font-size:1.6rem}
.score{font-size:3.6rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}

/* Kalkulator */
.calc{background:var(--dark);border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:14px;color:#fff}
.calc .screen{background:#2C2642;border-radius:20px;padding:14px 16px;min-height:92px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.calc .screen .lbl{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--lavender);font-weight:800}
.calc .preview{font-size:1.9rem;font-weight:800;overflow-x:auto;white-space:nowrap;text-align:right}
.calc .seg{background:#2C2642;box-shadow:none}
.calc .seg button{color:#fff}
.calc .seg button[aria-pressed="true"]{background:var(--lavender);color:var(--dark)}
.calc .tool{background:#2C2642;color:#fff;box-shadow:none}
.calc .tool[aria-pressed="true"]{background:var(--kuning);color:var(--dark)}
.calc .hint2{font-size:.875rem;color:#D9D2EE}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.inp{display:flex;flex-direction:column;gap:4px;font-size:.8125rem;font-weight:800;color:var(--muted);min-width:0}
.calc .inp{color:#D9D2EE}
.inp input{min-height:54px;font-size:1.3rem;font-weight:900;border:0;border-radius:16px;background:var(--surface);color:var(--ink);padding:0 14px;font-family:inherit;width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}
.result{border-radius:24px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:4px;background:var(--lavender)}
.result .mx{font-size:1.7rem}
.kv{display:grid;grid-template-columns:minmax(0,1fr);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.kv > div{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-bottom:1px solid var(--line);min-width:0}
.kv > div:last-child{border-bottom:0}
.kv span{font-size:.8125rem;font-weight:800;color:var(--muted)}
.kv b{font-size:1.0625rem;font-weight:700;overflow-x:auto;white-space:nowrap}
.err{color:var(--danger);font-weight:800;font-size:.9375rem}

/* Laporan & pemilik */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.75rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:.8125rem;color:var(--muted);font-weight:800}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font)}
.prow{display:grid;grid-template-columns:70px 1fr 44px;gap:10px;align-items:center;font-weight:800;font-size:.9375rem;font-variant-numeric:tabular-nums}
.ptrack{height:14px;border-radius:7px;background:var(--lav-soft);overflow:hidden}
.ptrack i{display:block;height:100%;border-radius:7px}
.vcard{border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.vhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.vhead > div{min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.8125rem;font-weight:800;padding:4px 12px;border-radius:999px;background:var(--lav-soft);font-variant-numeric:tabular-nums}
.pill.good{background:var(--success-bg);color:var(--success)}
.pill.bad{background:var(--danger-bg);color:var(--danger)}
.tblwrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
table.tbl{border-collapse:collapse;font-size:.875rem;min-width:520px;width:100%}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--cream);position:sticky;top:0}
.tbl td.ok{color:var(--success);font-weight:900}
.tbl td.no{color:var(--danger);font-weight:900}
.tbl td.t{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(31,26,46,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:28px 28px 0 0;max-height:85%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{display:flex;flex-direction:column;gap:12px;padding-block:10px 18px;overflow-y:auto}
.sheet .head{display:flex;align-items:center;justify-content:space-between}
.flash{border:0;border-radius:22px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:96px;touch-action:manipulation}
.flash .mx{font-size:1.25rem}
.flash .tap{font-size:.75rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.sq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sqc{border:0;border-radius:14px;padding:8px 4px;text-align:center;font-variant-numeric:tabular-nums;font-size:.875rem;cursor:pointer;min-width:0;overflow:hidden;background:var(--surface);box-shadow:0 2px 0 var(--line)}
.sqc b{display:block;font-size:1.05rem;font-weight:900}
.sqc.on{background:var(--ungu);color:#fff}
.sqform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sqone{display:flex;flex-direction:column;gap:8px;border-radius:20px;padding:14px;background:var(--kun-soft)}
.sqone .out{font-size:1.3rem;font-weight:900;font-variant-numeric:tabular-nums}

/* Asisten Si Akar (chat) */
.sheet.chat{height:90%;max-height:90%}
.sheet.chat .wrap{overflow:visible}
.sheet.chat .chathead{flex-direction:row;align-items:center;gap:10px;padding-block:12px 6px}
.sheet.chat .chatbody{flex:1;min-height:0;overflow-y:auto;gap:12px;padding-block:8px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.me{align-self:flex-end;background:var(--ungu);color:#fff;padding:10px 14px;border-radius:20px 20px 6px 20px;white-space:pre-wrap;word-break:break-word}
.msg.ai .who{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--lav-soft);display:grid;place-items:center}
.msg.ai .who svg{width:30px;height:30px}
.bubble{background:var(--surface);box-shadow:var(--shadow);padding:10px 14px;border-radius:20px 20px 20px 6px;word-break:break-word}
.bubble.typing{color:var(--muted);font-style:italic}
.meta{font-size:.72rem;color:var(--muted);font-weight:700;margin:4px 0 0 6px}
.sheet.chat .chatfoot{gap:8px;padding-block:8px 12px;border-top:1px solid var(--line)}
.quick{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 4px}
.quick .tool{white-space:nowrap;flex:0 0 auto}
.chatin{display:flex;gap:8px;align-items:flex-end}
.chatin textarea{min-height:54px;max-height:120px;padding:14px 16px;resize:none;font-size:1rem}
.chatin .btn{flex:0 0 54px;width:54px;padding:0}
.askbtn svg{width:34px;height:34px}

/* Efek perayaan */
.fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.cf{position:absolute;top:-16px;width:10px;height:14px;border-radius:3px;animation:fall 1.5s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
@media (prefers-reduced-motion: reduce){.cf{display:none}.pop{animation:none}.ans .caret{animation:none}}

/* Pemberitahuan singkat */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--dark);color:#fff;padding:12px 18px;border-radius:18px;font-weight:800;font-size:.9375rem;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(31,26,46,.35)}
</style>

/* AkarKu — logika aplikasi (JavaScript)
 * Dimuat oleh index.html. Untuk Google Apps Script, jalankan ../build.sh
 * agar app.js dan style.css digabung menjadi ../dist/index.html. */
/* ================= Penyimpanan di perangkat ================= */
const KEY='akarku-prototipe-v2';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
const P=Object.assign({users:{},current:null,log:[],pin:null},load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
const U=()=>P.users[P.current];
function newUser(name,code){
  const id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  P.users[id]={name,code,created:Date.now(),li:0,lessonDone:false,quizScore:null,quizBest:null,litDone:false,paas:null};
  return id;
}
function logEv(area,q,ans,ok,extra){
  if(!P.current) return;
  const ev=Object.assign({id:P.current+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),uid:P.current,t:Date.now(),area,q:q||'',ans:ans==null?'':String(ans),ok:ok===undefined?null:ok},extra||{});
  P.log.push(ev);
  if(P.log.length>5000) P.log.splice(0,P.log.length-5000);
  queueSync(ev);
  save();
}

/* ================= Rekap online ke Google Sheets =================
   Cara utama: aplikasi dibuka dari Google Apps Script (docs/13) → data dikirim lewat google.script.run.
   Jika dipublikasikan di tempat lain (misalnya Netlify), tempel URL Web App di SYNC_URL. */
const CONFIG={ SYNC_URL:'' };
const GAS=typeof google!=='undefined'&&!!(google.script&&google.script.run);
const SYNC_ON=GAS||/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(CONFIG.SYNC_URL.trim());
function gasCall(fn,arg){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](arg))}
async function apiPost(body){
  if(GAS) return body.type==='events'?gasCall('saveEventsApi',body.events):gasCall('readDataApi',body.key);
  const res=await fetch(CONFIG.SYNC_URL.trim(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  return res.json();
}
if(!Array.isArray(P.outbox)) P.outbox=[];
let flushTimer=null, flushing=false;
function queueSync(ev){
  if(!SYNC_ON) return;
  const u=P.users[ev.uid]||{};
  P.outbox.push(Object.assign({name:u.name||'',code:u.code||''},ev));
  if(P.outbox.length>3000) P.outbox.splice(0,P.outbox.length-3000);
  clearTimeout(flushTimer); flushTimer=setTimeout(flush,1500);
}
async function flush(){
  if(!SYNC_ON||flushing||!P.outbox.length||navigator.onLine===false) return;
  flushing=true; let more=false;
  try{
    const j=await apiPost({type:'events',events:P.outbox.slice(0,50)});
    if(j&&j.ok&&Array.isArray(j.ids)){ const done=new Set(j.ids); P.outbox=P.outbox.filter(e=>!done.has(e.id)); save(); more=P.outbox.length>0; }
  }catch(_){ /* dicoba lagi nanti */ }
  finally{ flushing=false; }
  if(more) setTimeout(flush,500);
}
window.addEventListener('online',flush);
setInterval(flush,20000);

/* ================= Util ================= */
const R=b=>`<span class="rad"><span class="s">√</span><span class="b">${b}</span></span>`;
const RI=(n,b)=>n===2?R(b):`<span class="rad"><sup class="idx">${n}</sup><span class="s">√</span><span class="b">${b}</span></span>`;
const H=x=>`<mark class="hl">${x}</mark>`;
const FR=(x,y)=>`<span class="frac"><span class="vh">(</span><span class="fn">${x}</span><span class="vh">)/(</span><span class="fd">${y}</span><span class="vh">)</span></span>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=h=>String(h).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();
const num=n=>Number(n).toLocaleString('id-ID');
const dec=x=>Number(x).toLocaleString('id-ID',{maximumFractionDigits:4});
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t}return a}
function lpsf(n){for(let k=Math.floor(Math.sqrt(n));k>=1;k--){if(n%(k*k)===0)return k*k}return 1}
function factor(n){const f=[];let d=2;while(d*d<=n){let e=0;while(n%d===0){n/=d;e++}if(e)f.push([d,e]);d+=d===2?1:2}if(n>1)f.push([n,1]);return f}
function ipow(b,e){let r=1;for(let i=0;i<e;i++)r*=b;return r}
function simplifyN(b,n){const f=factor(b);let k=1,m=1;f.forEach(([p,e])=>{k*=ipow(p,Math.floor(e/n));m*=ipow(p,e%n)});return {k,m,f}}
function iroot(b,n){let k=Math.floor(Math.pow(b,1/n)+1e-9);while(k>0&&ipow(k,n)>b)k--;while(ipow(k+1,n)<=b)k++;return k}
const supN=n=>n===2?'²':n===3?'³':`<sup>${n}</sup>`;
const CRN=(c,n,m)=>m===1?num(c):(c===1?'':num(c))+RI(n,num(m));
const CR=(c,m)=>CRN(c,2,m);
const CRs=(c,m)=>c===0?'0':(c<0?'−':'')+CR(Math.abs(c),m);
const idxName=n=>n===2?'akar kuadrat':n===3?'akar pangkat tiga':'akar pangkat '+n;
const perfName=n=>n===2?'kuadrat sempurna':n===3?'pangkat tiga sempurna (kubik)':'pangkat '+n+' sempurna';
function fracRad(nu,de,m){ if(de<0){nu=-nu;de=-de} const g=gcd(nu,de)||1; nu/=g; de/=g; const neg=nu<0,a=Math.abs(nu); if(de===1) return (neg?'−':'')+CR(a,m); return (neg?'−':'')+FR(CR(a,m),num(de)); }
function fmtInput(s){if(!s)return'';const i=s.indexOf('√');if(i<0)return esc(s);return esc(s.slice(0,i))+R(s.slice(i+1)||'&nbsp;&nbsp;')}
function parse(s){ const m=/^(\d*)(?:√(\d+))?$/.exec(s); if(!s||!m||(s.includes('√')&&!m[2])) return null; if(!m[1]&&!m[2]) return null; return {a:m[1]?parseInt(m[1],10):1,b:m[2]?parseInt(m[2],10):1}; }
function mk(c,k,m){return {c,k,m,n:k*k*m,coef:c*k}}
const problemHTML=q=>(q.c>1?q.c:'')+R(q.n);
const problemPlain=q=>(q.c>1?q.c:'')+'√'+q.n;
function solution(q){
  const k2=q.k*q.k;
  if(q.c===1) return `${R(q.n)} = ${R(H(k2)+' × '+q.m)} = ${H(q.k)}${R(q.m)}`;
  return `${q.c}${R(q.n)} = ${q.c} × ${R(H(k2)+' × '+q.m)} = ${q.c} × ${q.k}${R(q.m)} = ${H(q.coef)}${R(q.m)}`;
}
function check(input,q){
  const v=parse(input);
  if(!v) return {ok:false,msg:'Tulis jawaban dalam bentuk a√b, misalnya 6√2.',invalid:true};
  const {a,b}=v,E=q.coef,m=q.m,k2=q.k*q.k, equiv=a*a*b===E*E*m;
  if(equiv&&lpsf(b)===1) return {ok:true,msg:`Tepat! ${solution(q)}`};
  if(equiv) return {ok:false,msg:`Hampir! Nilainya sudah benar, tetapi ${b} masih punya faktor kuadrat sempurna ${H(lpsf(b))}. Sederhanakan lagi.`};
  if(a===m&&b===E) return {ok:false,msg:`Tertukar. Angka yang keluar dari akar adalah ${E}, sedangkan ${m} tetap di dalam akar.`};
  if(a===k2*q.c&&b===m) return {ok:false,msg:`Ingat, yang keluar adalah akarnya: ${R(k2)} = ${q.k}, bukan ${k2}.`};
  if(q.c>1&&a===q.k&&b===m) return {ok:false,msg:`Hampir! Jangan lupa angka ${q.c} di depan: ${q.c} × ${q.k} = ${E}.`};
  if(a===E&&b!==m) return {ok:false,msg:`Angka di luar akar sudah benar. Cek lagi angka di dalam akar: ${q.n} ÷ ${k2} = ${m}.`};
  return {ok:false,msg:`Belum tepat. Cari kuadrat sempurna terbesar yang membagi ${q.n}, yaitu ${k2}.`};
}
function gen(level,avoid){
  const ms=[2,3,5,6,7,10,11];
  for(let t=0;t<500;t++){
    let c=1,k=rnd(2,10),m=pick(ms),n=k*k*m,ok=false;
    if(level==='mudah') ok=n>=8&&n<=50; else if(level==='sedang') ok=n>50&&n<=200;
    else { if(Math.random()<.5){ok=n>200&&n<=600}else{c=rnd(2,4);ok=n>=8&&n<=75} }
    if(ok&&n!==avoid) return mk(c,k,m);
  }
  return mk(1,3,2);
}

function celebrate(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fx=document.getElementById('fx'); if(!fx) return;
  const cols=['#8061C9','#BCA5F5','#8BC5F5','#FFE18A','#F5A3C7'];
  for(let i=0;i<34;i++){
    const s=document.createElement('span'); s.className='cf';
    s.style.left=Math.random()*100+'%'; s.style.background=cols[i%cols.length];
    s.style.setProperty('--dx',(Math.random()*160-80)+'px'); s.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    s.style.animationDelay=(Math.random()*.25)+'s'; fx.appendChild(s);
  }
  setTimeout(()=>{fx.innerHTML=''},1900);
}

/* ================= Belajar ================= */
function viewBelajar(){
  const u=U(), L=LESSON[u.li], s=S.scr; let body='', bar='';
  const nav=(canNext,label='Lanjut →')=>`<div class="row"><button class="btn ghost" data-act="prev" ${u.li===0?'disabled':''}>← Kembali</button><button class="btn primary" data-act="next" ${canNext?'':'disabled'}>${label}</button></div>`;
  if(L.kind==='text'){
    body=`${L.tag?`<span class="tag">${L.tag}</span>`:''}<h2>${L.title}</h2><div class="card ${L.tone||''}">${L.ill||''}${L.html}<div class="mx center">${L.mx}</div></div>${L.tip?`<p class="muted small">${L.tip}</p>`:''}`;
    bar=nav(true);
  } else if(L.kind==='worked'){
    const st=L.steps.map((x,i)=>i<s.rev?`<div class="step ${i<s.rev-1?'past':''}"><div class="mx">${x.mx}</div><div class="why">${x.why}</div></div>`:'').join('');
    body=`<span class="tag">Contoh lengkap</span><h2>${L.title}</h2><div class="card"><p><b>${L.problem}</b></p><div class="steps">${st}</div></div><p class="muted small">Langkah ${s.rev} dari ${L.steps.length}</p>`;
    const more=s.rev<L.steps.length;
    bar=`<div class="row"><button class="btn ghost" data-act="replay">↺ Ulangi</button>${more?`<button class="btn ungu" data-act="reveal">Langkah berikutnya ↓</button>`:`<button class="btn primary" data-act="next">Lanjut →</button>`}</div>`;
  } else if(L.kind==='faded'){
    const parts=L.parts.slice(0,s.part+1).map((p,pi)=>{
      const pk=s.picked[pi]||[], solved=pk.includes(p.correct);
      const opts=p.options.map((o,oi)=>`<button class="opt ${pk.includes(oi)?(oi===p.correct?'sel-ok':'sel-no'):''}" data-act="pick" data-p="${pi}" data-o="${oi}" ${solved||pk.includes(oi)?'disabled':''}>${o}</button>`).join('');
      const last=pk[pk.length-1];
      const fb=last===undefined?'':(last===p.correct?fbBox(true,p.ok):fbBox(false,p.no[last]));
      return `<div class="card"><p>${p.ask}</p><div class="opts">${opts}</div>${fb}</div>`;
    }).join('');
    body=`<span class="tag">Contoh rumpang</span><h2>${L.title}</h2><div class="card t-lav"><p><b>${L.problem}</b></p>${L.given.map(g=>`<div class="mx">${g}</div>`).join('')}</div>${parts}`;
    bar=nav(s.done);
  } else if(L.kind==='explain'){
    const pk=s.picked[0];
    const opts=L.options.map((o,oi)=>`<button class="opt ${pk===oi?(oi===L.correct?'sel-ok':'sel-no'):(pk!==undefined&&oi===L.correct?'sel-ok':'')}" data-act="pick1" data-o="${oi}" ${pk!==undefined?'disabled':''}>${o}</button>`).join('');
    body=`<span class="tag">Jelaskan</span><h2>${L.title}</h2><div class="card"><p>${L.q}</p><div class="opts">${opts}</div>${pk!==undefined?fbBox(pk===L.correct,L.fb,pk===L.correct?'Tepat!':'Perhatikan'):''}</div>`;
    bar=nav(s.done);
  } else if(L.kind==='pattern'){
    body=`<span class="tag">Ringkasan</span><h2>${L.title}</h2><div class="card t-kun" style="flex-direction:row;align-items:center;gap:12px"><ol class="pola" style="flex:1">${L.points.map(x=>`<li>${x}</li>`).join('')}</ol>${MASCOT('').replace('<svg','<svg style="width:84px;height:84px;flex:0 0 84px"')}</div><p class="muted small">Pola ini berlaku untuk semua soal menyederhanakan bentuk akar.</p>`;
    bar=nav(true);
  } else if(L.kind==='context'){
    const pk=s.picked[0];
    const opts=L.options.map((o,oi)=>`<button class="opt ${pk===oi?(oi===L.correct?'sel-ok':'sel-no'):''}" data-act="pick1" data-o="${oi}" ${pk===L.correct||pk===oi?'disabled':''}>${o}</button>`).join('');
    const st=L.steps.map(x=>`<div class="step"><div class="mx">${x.mx}</div><div class="why">${x.why}</div></div>`).join('');
    const cmp=`<div class="cmp">${L.cmp.map(c=>`<span>${c[0]}</span><b>${c[1]}</b>`).join('')}</div>`;
    body=`<span class="tag">${L.tag}</span><h2>${L.title}</h2><div class="card">${L.intro}<div class="steps">${st}</div></div><div class="card t-biru">${illTileBox()}${L.q}${cmp}<div class="opts">${opts}</div>${pk!==undefined?fbBox(pk===L.correct,pk===L.correct?L.fb:L.fbNo):''}</div>`;
    bar=nav(s.done);
  } else if(L.kind==='quiz'){
    const z=s.quiz;
    if(z.i>=QUIZ.length){
      body=`<span class="tag">Kuis modul</span><div class="card t-lav" style="align-items:center;text-align:center">${MASCOT('').replace('<svg','<svg style="width:110px;height:110px"')}<div class="score">${z.score}/5</div><p><b>${z.score>=4?'Hebat! Kamu sudah tuntas.':'Belum tuntas (perlu minimal 4 benar).'}</b></p><p class="small muted">${z.score>=4?'Lanjutkan ke refleksi.':'Coba ulangi contoh, lalu kerjakan Latihan.'}</p></div>`;
      bar=`<div class="row"><button class="btn ghost" data-act="quizRetry">↺ Ulangi kuis</button><button class="btn primary" data-act="next">Lanjut →</button></div>`;
    } else {
      const q=QUIZ[z.i];
      body=`<span class="tag">Kuis modul · Soal ${z.i+1} dari 5</span><h2>Sederhanakan</h2><div class="card t-lav"><div class="mx center" style="font-size:1.9rem">${problemHTML(q)}</div></div>${ansBox(z.input)}${z.fb?fbBox(z.fb.ok,z.fb.ok?z.fb.msg:z.fb.msg+`<br><span class="muted small">Pembahasan: ${solution(q)}</span>`):''}`;
      bar=z.fb?`<button class="btn primary" data-act="quizNext">${z.i<4?'Soal berikutnya →':'Lihat skor →'}</button>`:`${keyboard(z.input)}<button class="btn primary" data-act="quizCheck" ${z.input?'':'disabled'}>Periksa</button>`;
    }
  } else if(L.kind==='reflect'){
    const b=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="paas" data-v="${n}" aria-pressed="${s.paas===n}">${n}</button>`).join('');
    body=`<span class="tag">Refleksi</span><h2>Modul M2 selesai 🎉</h2><div class="card"><p><b>Seberapa berat usaha mentalmu untuk memahami materi ini?</b></p><div class="paas">${b}</div><div class="row small muted"><span>1 = sangat ringan</span><span style="text-align:right">9 = sangat berat</span></div></div>
      <div class="card"><label for="note"><b>Bagian yang masih membingungkan?</b> <span class="muted small">(boleh dikosongkan)</span></label><textarea id="note" class="field" maxlength="300">${esc(s.note)}</textarea></div>`;
    bar=`<button class="btn primary" data-act="finish" ${s.paas?'':'disabled'}>Simpan dan selesai</button>`;
  }
  const showTools=!['quiz','reflect'].includes(L.kind);
  return topbar('Menyederhanakan',[u.li+1,LESSON.length],showTools)+`<main><div class="wrap">${body}</div></main>`+actions((showTools?tools:'')+bar);
}

/* ================= Latihan ================= */
function newPrac(level,avoid){ S.prac={level,q:gen(level,avoid),input:'',hints:0,fb:null,ex:gen(level,avoid),tries:0,last:''}; }
function viewLatihan(){
  const p=S.prac,q=p.q;
  const pr=P.log.filter(e=>e.uid===P.current&&e.area==='latihan'), pb=pr.filter(e=>e.ok).length;
  const seg=['mudah','sedang','sulit'].map(l=>`<button data-act="level" data-l="${l}" aria-pressed="${p.level===l}">${l[0].toUpperCase()+l.slice(1)}</button>`).join('');
  const hintTexts=[`Cari kuadrat sempurna terbesar yang membagi ${q.n}. Lihat Tabel kuadrat jika perlu.`,
    `${q.n} = ${q.k*q.k} × ${q.m}, dan ${q.k*q.k} = ${q.k} × ${q.k}.${q.c>1?` Jangan lupa kalikan dengan ${q.c}.`:''}`,
    `Contoh mirip: ${solution(mk(1,p.ex.k,p.ex.m))}`];
  const hints=hintTexts.slice(0,p.hints).map((h,i)=>`<div class="hint"><span class="tag">Petunjuk ${i+1} dari 3</span><div>${h}</div></div>`).join('');
  const body=`<div class="seg" role="group" aria-label="Tingkat kesulitan">${seg}</div>
    <div class="card t-biru"><span class="tag">Sederhanakan</span><div class="mx center" style="font-size:2rem">${problemHTML(q)}</div></div>
    ${ansBox(p.input)}
    ${!p.fb&&p.hints<3?`<button class="hintbtn" data-act="hint">💡 Butuh petunjuk? (${p.hints}/3)</button>`:''}
    ${hints}
    ${p.fb?fbBox(p.fb.ok,p.fb.ok?p.fb.msg:p.fb.msg+`<br><span class="muted small">Pembahasan: ${solution(q)}</span>`):''}
    <p class="muted small" style="font-variant-numeric:tabular-nums">Hasilmu: ${pb} benar dari ${pr.length} soal. Petunjuk tidak mengurangi nilai.</p>`;
  let bar;
  if(p.fb) bar=p.fb.ok?`<button class="btn primary" data-act="pracNext">Soal berikutnya →</button>`:`<div class="row"><button class="btn ghost" data-act="pracRetry">Coba lagi</button><button class="btn primary" data-act="pracNext">Coba soal mirip →</button></div>`;
  else bar=`${keyboard(p.input)}<div class="row"><button class="btn ghost" data-act="sheet" data-tab="tabel" style="flex:0 0 auto" aria-label="Tabel kuadrat">🔢</button><button class="btn primary" data-act="pracCheck" ${p.input?'':'disabled'}>Periksa</button></div>`;
  return topbar('Latihan Soal',null,true)+`<main><div class="wrap">${body}</div></main>`+actions(bar);
}

/* ================= Pojok Literasi ================= */
function newLit(){ S.lit={step:1,tapped:[],model:null,input:'',fb:null,approx:null,concl:null}; }
function viewLiterasi(){
  const t=S.lit;
  const chip=(id,txt)=>t.step===1?`<button class="chip ${t.tapped.includes(id)?'on':''}" data-act="tap" data-id="${id}" aria-pressed="${t.tapped.includes(id)}">${txt}</button>`:`<b>${txt}</b>`;
  const cyc=['Rumuskan','Kerjakan','Tafsirkan'].map((n,i)=>`<span class="${t.step>i+1?'done':t.step===i+1?'on':''}">${t.step>i+1?'✓ ':''}${i+1}. ${n}</span>`).join('');
  let body=`<div class="cycle" aria-label="Siklus literasi">${cyc}</div>
   <div class="card t-kun"><span class="tag">Cerita · Kehidupan sehari-hari</span>${illTileBox()}<p class="stim">Pak Budi punya ubin berbentuk persegi. Luas ubin itu ${chip('a','50 cm²')}.</p><p class="stim">Ia ingin memasukkan ubin ke dalam kotak. Bagian dalam kotak berbentuk persegi dengan sisi ${chip('b','7 cm')}.</p><p class="stim"><b>Apakah ubin bisa masuk ke dalam kotak?</b></p></div>`;
  let bar='';
  if(t.step===1){
    const models=['s = 50 ÷ 4',`s = ${R(50)}`,'s = 50²'], both=t.tapped.length===2;
    body+=`<div class="card"><p><b>Langkah 1 · Rumuskan</b></p><p class="small">Ketuk dua ukuran yang penting pada cerita di atas.</p>
      ${both?`<p class="small">Luas persegi = sisi × sisi. Rumus mana yang tepat untuk mencari sisi ubin?</p><div class="opts">${models.map((m,i)=>`<button class="opt ${t.model===i?(i===1?'sel-ok':'sel-no'):''}" data-act="model" data-o="${i}" ${t.model===1?'disabled':''}>${m}</button>`).join('')}</div>`:''}
      ${t.model!==null?(t.model===1?fbBox(true,'Luas = sisi × sisi. Jadi, sisi = akar dari luas.'):fbBox(false,'Kita mencari bilangan yang jika dikalikan dengan dirinya sendiri hasilnya 50. Itu artinya akar dari 50.')):''}</div>`;
    bar=`<button class="btn primary" data-act="litNext" ${t.model===1?'':'disabled'}>Lanjut ke Kerjakan →</button>`;
  } else if(t.step===2){
    body+=`<div class="card"><p><b>Langkah 2 · Kerjakan</b></p><p class="small">Sederhanakan ${R(50)}.</p></div>${ansBox(t.input)}${t.fb?fbBox(t.fb.ok,t.fb.msg):''}`;
    bar=t.fb&&t.fb.ok?`<button class="btn primary" data-act="litNext">Lanjut ke Tafsirkan →</button>`:`${keyboard(t.input)}<button class="btn primary" data-act="litCheck" ${t.input?'':'disabled'}>Periksa</button>`;
  } else if(t.step===3){
    const ap=[['7,07',true],['7,5',false],['25',false],['5,2',false]], pos=(Math.sqrt(50)-6)/2*100;
    body+=`<div class="card"><p><b>Langkah 3 · Tafsirkan</b></p><p class="small">Sisi ubin = 5${R(2)} cm. Kira-kira berapa cm? (${R(2)} kira-kira 1,414)</p>
      <div class="opts">${ap.map((a,i)=>`<button class="opt ${t.approx===i?(a[1]?'sel-ok':'sel-no'):''}" data-act="approx" data-o="${i}" ${t.approx===0?'disabled':''}>${a[0]} cm</button>`).join('')}</div>
      ${t.approx!==null&&t.approx!==0?fbBox(false,'Hitung 5 × 1,414.'):''}
      ${t.approx===0?`<div class="nl" aria-label="Garis bilangan: 5√2 sekitar 7,07, sedikit di kanan 7"><div class="line"></div>
        ${[6,7,8].map(n=>{const x=(n-6)/2*100;return `<div class="tick" style="left:calc(${x}% - 1px)"></div><div class="lbl" style="left:${x}%">${n}</div>`}).join('')}
        <div class="dot" style="left:${pos}%"></div><div class="dl" style="left:${pos}%">≈ ${approx(Math.sqrt(50))}</div></div>`:''}</div>`;
    if(t.approx===0) body+=`<div class="card"><p class="small"><b>Kesimpulan:</b> sisi ubin kira-kira 7,07 cm. Sisi kotak 7 cm. Apakah ubin bisa masuk ke dalam kotak?</p><div class="cmp"><span>Sisi ubin</span><b>7,07 cm</b><span>Sisi kotak</span><b>7 cm</b></div><div class="opts">${['Bisa masuk','Tidak bisa masuk'].map((c,i)=>`<button class="opt ${t.concl===i?(i===1?'sel-ok':'sel-no'):''}" data-act="concl" data-o="${i}" ${t.concl===1?'disabled':''}>${c}</button>`).join('')}</div>
      ${t.concl===1?fbBox(true,'Sisi ubin 7,07 cm lebih besar dari sisi kotak 7 cm. Jadi, ubin tidak bisa masuk. Hasil ini masuk akal, karena 7 × 7 = 49, hampir sama dengan 50.','Tepat, dan masuk akal!'):t.concl===0?fbBox(false,'Bandingkan 7,07 cm dan 7 cm. Ubin hanya bisa masuk jika sisinya sama atau lebih kecil dari sisi kotak.'):''}</div>`;
    bar=`<button class="btn primary" data-act="litDone" ${t.concl===1?'':'disabled'}>Selesai</button>`;
  } else {
    body=`<div class="card t-lav" style="align-items:center;text-align:center">${MASCOT('').replace('<svg','<svg style="width:110px;height:110px"')}<h2>Pojok Literasi selesai!</h2></div><div class="card"><p>Kamu sudah memakai bentuk akar untuk masalah nyata:</p><ol class="pola"><li><b>Rumuskan</b>: memilih ukuran yang penting dan rumus s = ${R(50)}</li><li><b>Kerjakan</b>: ${R(50)} = 5${R(2)}</li><li><b>Tafsirkan</b>: 5${R(2)} ≈ 7,07 cm, lebih besar dari 7 cm, jadi ubin tidak bisa masuk ke kotak</li></ol></div>`;
    bar=`<div class="row"><button class="btn ghost" data-act="litAgain">↺ Ulangi</button><button class="btn primary" data-act="home">Ke beranda</button></div>`;
  }
  return topbar('Pojok Literasi',null,t.step<4)+`<main><div class="wrap">${body}</div></main>`+actions(bar);
}

/* ================= Paket Soal ================= */
function viewSoal(){
  const ex=S.exam, u=U();
  if(!ex){
    const cards=['mudah','sedang','sulit'].map(l=>{const r=(u.paket||{})[l],[nm,desc,tone,em]=LEVEL_INFO[l];
      return `<button class="lvl ${tone}" data-act="examStart" data-l="${l}"><span class="badge">${em}</span><div><b style="font-size:1.15rem;font-weight:900">${nm} · 10 soal</b><p class="small muted">${desc}</p><p class="small" style="font-weight:800;margin-top:4px">${r?`Terakhir ${r.last} · Terbaik ${r.best} · ${r.n}×`:'Belum dikerjakan'}</p></div><span class="go">↗</span></button>`}).join('');
    return topbar('Paket Soal')+`<main class="has-nav"><div class="wrap">
      <div class="card t-ungu" style="flex-direction:row;align-items:center"><div style="flex:1"><h2 style="color:#fff">Uji kemampuanmu!</h2><p class="small muted">10 soal per tingkat. Pindah soal sesukamu, nilai muncul setelah Selesai. Tanpa batas waktu.</p></div>${ICO.trophy.replace('class="ico"','style="width:72px;height:72px;flex:0 0 72px"')}</div>
      ${cards}
      <p class="muted small">Kartu rumus, tabel kuadrat, dan kalkulator tidak bisa dibuka selama mengerjakan paket soal.</p>
    </div></main>${bnav()}`;
  }
  const qs=BANK[ex.level], name=LEVEL_INFO[ex.level][0];
  if(ex.done){
    const benar=ex.result.filter(Boolean).length, nilai=benar*10;
    const review=qs.map((q,i)=>{
      const a=ex.answers[i], ok=ex.result[i];

const toInt=v=>{const n=Number(String(v).trim());return Number.isInteger(n)?n:NaN};
function calcSimplify(aS,nS,bS){
  const a=toInt(aS||1), n=toInt(nS), b=toInt(bS);
  if(!(n>=2&&n<=10)) return {err:'Akar pangkat harus bilangan bulat 2 sampai 10.'};
  if(!(b>=1&&b<=10000000)) return {err:'Angka di dalam akar harus bilangan bulat 1 sampai 10.000.000.'};
  if(!(a>=1&&a<=1000)) return {err:'Angka di depan akar harus bilangan bulat 1 sampai 1.000.'};
  const {k,m,f}=simplifyN(b,n), K=a*k, kn=ipow(k,n);
  const expr=`${a>1?num(a):''}${RI(n,num(b))}`, res=CRN(K,n,m);
  const total=f.reduce((s,[,e])=>s+e,0);
  const flat=b===1?'1':(total<=16?f.map(([p,e])=>Array(e).fill(p).join(' × ')).join(' × '):f.map(([p,e])=>e>1?`${p}<sup>${e}</sup>`:p).join(' × '));
  const steps=[{mx:`${num(b)} = ${flat}`,why:b===1?'Angka 1 tidak perlu difaktorkan.':(f.length===1&&f[0][1]===1?`${num(b)} adalah bilangan prima, jadi tidak bisa dipecah lagi.`:`Pecah ${num(b)} menjadi perkalian bilangan prima (faktorisasi prima).`)}];
  if(total<=24&&b>1){
    const parts=[];
    f.forEach(([p,e])=>{for(let i=0;i<Math.floor(e/n);i++)parts.push(`<span class="grp">(${Array(n).fill(p).join(' × ')})</span>`);for(let j=0;j<e%n;j++)parts.push(p)});
    steps.push({mx:RI(n,parts.join(' × ')),why:`Untuk ${idxName(n)}, buat kelompok berisi ${n} angka yang sama. Angka yang tidak punya kelompok tetap di dalam akar.`});
  }
  const outs=f.flatMap(([p,e])=>Array(Math.floor(e/n)).fill(p));
  if(outs.length){
    steps.push({mx:`= ${H(num(k))}${m>1?RI(n,num(m)):''}`,why:`Setiap kelompok keluar dari akar sebagai satu angka: ${outs.length>1?outs.join(' × ')+' = ':''}${num(k)}. ${m>1?`Sisa ${num(m)} tetap di dalam akar.`:'Tidak ada sisa, jadi akarnya hilang.'}`});
    if(a>1) steps.push({mx:`${num(a)} × ${CRN(k,n,m)} = ${H(res)}`,why:'Kalikan dengan angka di depan akar.'});
  } else steps.push({mx:`${expr} = ${H(res)}`,why:b===1?'Akar dari 1 selalu 1, karena 1 dikali 1 berapa kali pun tetap 1.':`Tidak ada kelompok berisi ${n} angka yang sama, jadi tidak ada angka yang bisa keluar. Bentuk ini sudah paling sederhana.`});
  const r=iroot(b,n), perfect=ipow(r,n)===b;
  const info=[['Nilai desimal',`${expr} ${perfect?'=':'≈'} ${dec(a*Math.pow(b,1/n))}`],
    ['Letak di garis bilangan',perfect?`${RI(n,num(b))} tepat ${num(r)}, karena ${num(r)}${supN(n)} = ${num(b)}`:`${RI(n,num(b))} ada di antara ${num(r)} dan ${num(r+1)}, karena ${num(r)}${supN(n)} = ${num(ipow(r,n))} dan ${num(r+1)}${supN(n)} = ${num(ipow(r+1,n))}`],
    ['Bilangan '+perfName(n)+'?',perfect?`Ya, ${num(b)} = ${num(r)}${supN(n)}`:`Bukan, ${num(b)} bukan bilangan ${perfName(n)}`],
    ['Bentuk pangkat pecahan',`${a>1?num(a)+' × ':''}${num(b)}<sup>1/${n}</sup>`]];
  if(k>1&&m>1) info.splice(1,0,['Cara cepat',`${num(b)} = ${H(num(kn))} × ${num(m)}, dan ${num(kn)} = ${num(k)}${supN(n)} adalah bilangan ${perfName(n)} terbesar yang membagi ${num(b)}`]);
  if(a===1&&k>1&&m>1) info.push(['Cek balik',`(${res})${supN(n)} = ${num(k)}${supN(n)} × ${num(m)} = ${num(kn)} × ${num(m)} = ${num(b)} ✓`]);
  return {expr,res,steps,info};
}
function calcOp(o){
  const a1=toInt(o.a1||1),b1=toInt(o.b1),a2=toInt(o.a2||1),b2=toInt(o.b2),op=o.op;
  if(![a1,a2].every(x=>x>=1&&x<=1000)) return {err:'Angka di depan akar harus bilangan bulat 1 sampai 1.000.'};
  if(![b1,b2].every(x=>x>=1&&x<=100000)) return {err:'Angka di dalam akar harus bilangan bulat 1 sampai 100.000.'};
  const expr=`${CR(a1,b1)} ${op} ${CR(a2,b2)}`;
  const s1=simplifyN(b1,2),s2=simplifyN(b2,2),A=a1*s1.k,B=a2*s2.k,m1=s1.m,m2=s2.m;
  const steps=[]; let res, info=[]; const v1=a1*Math.sqrt(b1), v2=a2*Math.sqrt(b2);
  if(op==='+'||op==='−'){
    if(s1.k>1||s2.k>1) steps.push({mx:`${expr} = ${CR(A,m1)} ${op} ${CR(B,m2)}`,why:'Sederhanakan dulu masing-masing bentuk akar.'});
    if(m1===m2){ const C=op==='+'?A+B:A-B; res=CRs(C,m1); steps.push({mx:`= (${num(A)} ${op} ${num(B)})${m1>1?R(num(m1)):''} = ${H(res)}`,why:m1>1?'Angka di dalam akar sama (sejenis), jadi cukup hitung angka di depannya.':'Keduanya bilangan bulat, jadi langsung dihitung.'}); }
    else { res=`${CR(A,m1)} ${op} ${CR(B,m2)}`; steps.push({mx:`= ${H(res)}`,why:'Angka di dalam akar berbeda (tidak sejenis), jadi tidak bisa digabung menjadi satu bentuk akar.'}); }
    if(op==='+') info.push(['Hati-hati',`${R('a')} + ${R('b')} tidak sama dengan ${R('a + b')}. Contoh: ${R(9)} + ${R(16)} = 3 + 4 = 7, sedangkan ${R(25)} = 5.`]);
    info.unshift(['Nilai desimal',`≈ ${dec(op==='+'?v1+v2:v1-v2)}`]);
  } else if(op==='×'){
    const P2=b1*b2, s=simplifyN(P2,2), C=a1*a2*s.k; res=CR(C,s.m);
    steps.push({mx:`${expr} = (${num(a1)} × ${num(a2)})${R(num(b1)+' × '+num(b2))} = ${CR(a1*a2,P2)}`,why:'Kalikan angka di luar akar dengan di luar, angka di dalam akar dengan di dalam.'});
    if(s.k>1) steps.push({mx:`= ${num(a1*a2)} × ${R(H(num(s.k*s.k))+' × '+num(s.m))} = ${H(res)}`,why:`${num(s.k*s.k)} adalah kuadrat sempurna terbesar yang membagi ${num(P2)}.`});
    info.push(['Nilai desimal',`≈ ${dec(v1*v2)}`]);
  } else {
    if(b1%b2===0){
      const q=b1/b2, s=simplifyN(q,2);
      steps.push({mx:`${expr} = ${FR(num(a1),num(a2))} × ${R(num(b1)+' ÷ '+num(b2))} = ${FR(num(a1),num(a2))} × ${R(num(q))}`,why:'Bagi angka di luar dengan di luar, angka di dalam akar dengan di dalam.'});
      res=fracRad(a1*s.k,a2,s.m);
      steps.push({mx:`= ${H(res)}`,why:s.k>1?`Sederhanakan ${R(num(q))} = ${CR(s.k,s.m)}, lalu sederhanakan pecahannya.`:'Sederhanakan pecahannya jika bisa.'});
    } else {
      const s=simplifyN(b1*b2,2);
      steps.push({mx:`${expr} = ${FR(CR(a1,b1),CR(a2,b2))} × ${FR(R(num(b2)),R(num(b2)))}`,why:`Agar penyebut tidak mengandung akar, kalikan pembilang dan penyebut dengan ${R(num(b2))}.`});
      steps.push({mx:`= ${FR(CR(a1,b1*b2),num(a2*b2))}`,why:`${R(num(b2))} × ${R(num(b2))} = ${num(b2)}.`});
      res=fracRad(a1*s.k,a2*b2,s.m);
      steps.push({mx:`= ${H(res)}`,why:'Sederhanakan bentuk akar dan pecahannya.'});
    }
    info.push(['Nilai desimal',`≈ ${dec(v1/v2)}`]);
  }
  return {expr,res,steps,info};
}
function calcRas(r){
  const steps=[],info=[];
  if(r.form==='A'){
    const a=toInt(r.a),c=toInt(r.c||1),d=toInt(r.d);
    if(!(a>=1&&a<=100000)) return {err:'Pembilang harus bilangan bulat 1 sampai 100.000.'};
    if(!(c>=1&&c<=1000)) return {err:'Angka di depan akar harus bilangan bulat 1 sampai 1.000.'};
    if(!(d>=2&&d<=100000)) return {err:'Angka di dalam akar harus bilangan bulat 2 sampai 100.000.'};
    const expr=FR(num(a),CR(c,d)), s=simplifyN(d,2),c2=c*s.k,m=s.m;
    if(s.k>1) steps.push({mx:`${expr} = ${FR(num(a),CR(c2,m))}`,why:`Sederhanakan dulu akar di penyebut: ${R(num(d))} = ${CR(s.k,m)}.`});
    if(m===1){ const res=fracRad(a,c2,1); steps.push({mx:`= ${H(res)}`,why:'Akar di penyebut ternyata bilangan bulat, jadi penyebut sudah rasional.'}); return {expr,res,steps,info:[['Nilai desimal',`≈ ${dec(a/(c*Math.sqrt(d)))}`]]}; }
    steps.push({mx:`${FR(num(a),CR(c2,m))} × ${FR(R(num(m)),R(num(m)))}`,why:`Kalikan pembilang dan penyebut dengan ${R(num(m))}. Ini sama dengan mengalikan 1, jadi nilainya tidak berubah.`});
    steps.push({mx:`= ${FR(CR(a,m),num(c2*m))}`,why:`${R(num(m))} × ${R(num(m))} = ${num(m)}, jadi penyebutnya ${c2>1?num(c2)+' × '+num(m)+' = ':''}${num(c2*m)}.`});
    const res=fracRad(a,c2*m,m);
    steps.push({mx:`= ${H(res)}`,why:gcd(a,c2*m)>1?`Bagi pembilang dan penyebut dengan ${num(gcd(a,c2*m))}.`:'Pecahan ini sudah paling sederhana.'});
    info.push(['Nilai desimal',`≈ ${dec(a/(c*Math.sqrt(d)))}`],['Mengapa dirasionalkan?','Bentuk akar di penyebut dianggap belum sederhana. Setelah dirasionalkan, penyebutnya bilangan bulat.']);
    return {expr,res,steps,info};
  }
  const a=toInt(r.a),b=toInt(r.b),t=toInt(r.t||1),c=toInt(r.rc),sg=r.sign;
  if(!(a>=1&&a<=100000)) return {err:'Pembilang harus bilangan bulat 1 sampai 100.000.'};
  if(!(b>=0&&b<=1000)) return {err:'Angka pertama di penyebut harus bilangan bulat 0 sampai 1.000.'};
  if(!(t>=1&&t<=100)) return {err:'Angka di depan akar harus bilangan bulat 1 sampai 100.'};
  if(!(c>=2&&c<=10000)) return {err:'Angka di dalam akar harus bilangan bulat 2 sampai 10.000.'};
  const den=`${num(b)} ${sg} ${CR(t,c)}`, expr=FR(num(a),den);
  const s=simplifyN(c,2),t2=t*s.k,m=s.m, den2=`${num(b)} ${sg} ${CR(t2,m)}`;
  const val=a/(b+(sg==='+'?1:-1)*t*Math.sqrt(c));
  if(s.k>1) steps.push({mx:`${expr} = ${FR(num(a),den2)}`,why:`Sederhanakan dulu akar di penyebut: ${CR(t,c)} = ${CR(t2,m)}.`});
  if(m===1){ const Dv=sg==='+'?b+t2:b-t2; if(Dv===0) return {err:'Penyebutnya menjadi 0, jadi pecahan ini tidak punya nilai.'}; const res=fracRad(a,Dv,1); steps.push({mx:`= ${FR(num(a),num(Dv))} = ${H(res)}`,why:'Akar di penyebut ternyata bilangan bulat, jadi langsung dihitung.'}); return {expr,res,steps,info:[['Nilai desimal',`≈ ${dec(val)}`]]}; }
  const cs=sg==='+'?'−':'+', conj=`${num(b)} ${cs} ${CR(t2,m)}`, D=b*b-t2*t2*m;
  if(D===0) return {err:'Penyebutnya menjadi 0, jadi pecahan ini tidak punya nilai.'};
  steps.push({mx:`Sekawan dari ${den2} adalah ${H(conj)}`,why:'Bentuk sekawan didapat dengan mengganti tanda di tengah saja.'});
  steps.push({mx:`${FR(num(a),den2)} × ${FR(conj,conj)}`,why:'Kalikan pembilang dan penyebut dengan sekawannya. Ini sama dengan mengalikan 1.'});
  steps.push({mx:`Penyebut: ${num(b)}² − (${CR(t2,m)})² = ${num(b*b)} − ${num(t2*t2*m)} = ${num(D)}`,why:'Pakai pola (x + y)(x − y) = x² − y². Akarnya hilang dari penyebut.'});
  let Pn=a*b, Q=(cs==='−'?-1:1)*a*t2;
  steps.push({mx:`Pembilang: ${num(a)} × (${conj}) = ${b?num(Pn)+' '+cs+' ':''}${b?CR(a*t2,m):(cs==='−'?'−':'')+CR(a*t2,m)}`,why:'Kalikan pembilang ke setiap bagian di dalam kurung.'});
  let Dn=D; if(Dn<0){Pn=-Pn;Q=-Q;Dn=-Dn}
  const g=gcd(gcd(Pn,Q),Dn)||1; Pn/=g;Q/=g;Dn/=g;
  const top=(Pn!==0?num(Pn):'')+(Pn!==0?(Q<0?' − ':' + ')+CR(Math.abs(Q),m):(Q<0?'−':'')+CR(Math.abs(Q),m));

  info.push(['Nilai desimal',`≈ ${dec(val)}`],['Ingat','(x + y)(x − y) = x² − y². Karena itu sekawan selalu menghilangkan akar di penyebut.']);
  return {expr,res,steps,info};
}
function calcPreview(){

function scoreChart(evs){
  if(!evs.length) return `<p class="small muted">Belum ada nilai. Kerjakan Paket Soal untuk melihat grafik perkembanganmu.</p>`;
  const data=evs.slice(-8).map(e=>({v:+e.ans||0,l:/mudah/i.test(e.q)?'Mudah':/sedang/i.test(e.q)?'Sedang':'Sulit',t:e.t}));
  const W=320,Hh=200,L=30,Rr=8,T=26,B=40, ih=Hh-T-B, n=data.length, slot=(W-L-Rr)/8, bw=Math.min(26,slot*.62);
  const sel=S.repSel==null||S.repSel>=n?n-1:S.repSel;
  const y=v=>T+ih-(v/100)*ih;
  const grid=[0,50,100].map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#E8E2F4" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#6E6787">${v}</text>`).join('');
  const kkm=`<line x1="${L}" x2="${W-Rr}" y1="${y(70)}" y2="${y(70)}" stroke="#5B3FA3" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-Rr}" y="${y(70)-5}" text-anchor="end" font-size="10" font-weight="800" fill="#5B3FA3">KKM 70</text>`;
  const bars=data.map((d,i)=>{const cx=L+slot*i+slot/2, h=Math.max(4,(d.v/100)*ih), on=i===sel;
    return `<g class="bar-hit" data-act="repSel" data-i="${i}" style="cursor:pointer"><rect x="${cx-slot/2}" y="${T}" width="${slot}" height="${ih+B}" fill="transparent"/>
      <rect x="${cx-bw/2}" y="${T+ih-h}" width="${bw}" height="${h}" rx="${Math.min(10,bw/2)}" fill="${on?'#8061C9':'#BCA5F5'}"><title>${d.l}: ${d.v} (${fmtTime(d.t)})</title></rect>
      <text x="${cx}" y="${Hh-B+16}" text-anchor="middle" font-size="10" font-weight="${on?900:700}" fill="${on?'#221C35':'#6E6787'}">${d.l}</text>
      <text x="${cx}" y="${Hh-B+29}" text-anchor="middle" font-size="9" fill="#6E6787">${new Date(d.t).toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit'})}</text></g>`}).join('');
  const s=data[sel], sx=L+slot*sel+slot/2, sy=y(s.v)-8;
  const bub=`<g aria-hidden="true"><rect x="${Math.min(Math.max(sx-20,L),W-Rr-40)}" y="${sy-20}" width="40" height="20" rx="10" fill="#1F1A2E"/><text x="${Math.min(Math.max(sx,L+20),W-Rr-20)}" y="${sy-6}" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">${s.v}</text></g>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Grafik nilai paket soal: ${data.map(d=>d.l+' '+d.v).join(', ')}">${grid}${kkm}${bars}${bub}</svg>
   <p class="small muted">Ketuk batang untuk melihat nilainya. Garis putus-putus = KKM 70.</p>
   <details><summary class="small" style="font-weight:800;cursor:pointer">Lihat sebagai tabel</summary><div class="tblwrap" style="margin-top:8px"><table class="tbl" style="min-width:0"><thead><tr><th>Waktu</th><th>Paket</th><th>Nilai</th></tr></thead><tbody>${data.map(d=>`<tr><td class="t">${fmtTime(d.t)}</td><td>${d.l}</td><td>${d.v}</td></tr>`).join('')}</tbody></table></div></details>`;
}

function buildDataset(rows){
  const users={},log=[],seen=new Set();
  (rows||[]).forEach(r=>{
    if(!r||!r.uid||seen.has(r.id)) return; seen.add(r.id);
    const t=+new Date(r.waktu)||0;
    const ev={uid:String(r.uid),t,area:String(r.kegiatan||''),q:String(r.soal??''),ans:String(r.jawaban??''),ok:r.hasil==='benar'?true:r.hasil==='salah'?false:null};
    if(r.petunjuk) ev.hint=+r.petunjuk||0; if(r.catatan) ev.note=String(r.catatan);
    log.push(ev);
    const u=users[ev.uid]||(users[ev.uid]={name:'Tanpa nama',code:'',created:t,lastSeen:t,paket:{},litDone:false,paas:null});
    if(r.nama) u.name=String(r.nama); if(r.kode) u.code=String(r.kode);
  });
  log.sort((a,b)=>a.t-b.t);
  log.forEach(e=>{
    const u=users[e.uid]; u.created=Math.min(u.created,e.t); u.lastSeen=Math.max(u.lastSeen,e.t);
    if(e.area==='paket-selesai'){const l=/mudah/i.test(e.q)?'mudah':/sedang/i.test(e.q)?'sedang':'sulit';const v=+e.ans||0;const p=u.paket[l];u.paket[l]={last:v,best:Math.max(p?p.best:0,v),n:(p?p.n:0)+1};}
    if(e.area==='literasi'&&e.q.startsWith('Kesimpulan')&&e.ok) u.litDone=true;
    if(e.area==='refleksi') u.paas=+e.ans||null;
  });
  return {users,log};
}

}

  const pk=(u,l,f)=>{const r=(u.paket||{})[l];return r?r[f]:''};
  const rows=Object.keys(D.users).map(id=>{const s=userStats(id,D);return [s.u.name,s.u.code,s.visits,new Date(s.last).toISOString(),s.quizLast??'',s.quizN,s.latB,s.latN,s.lit?'ya':'tidak',s.paas??'',s.calc,pk(s.u,'mudah','last'),pk(s.u,'mudah','best'),pk(s.u,'sedang','last'),pk(s.u,'sedang','best'),pk(s.u,'sulit','last'),pk(s.u,'sulit','best')].map(q).join(',')});

async function deliverPdf(doc,name){
  if(GAS){

  if(window.claude) return {err:'Link demo claude.ai belum bisa menyimpan PDF di perangkat ini. Gunakan link AkarKu dari Google Apps Script (docs/13).'};

  try{ canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type:'application/pdf'})]})); }catch(_){}

}

const RMT={1:'Pengembangan kognitif',2:'Konten sebagai proses',3:'Praktik konseptual'};
/* Instruksi pedagogis (sama dengan TUTOR_PROMPT di backend/Code.gs). Dipakai saat Si Akar memanggil layanan AI langsung dari browser. */
const TUTOR_RULES=`Kamu adalah "Si Akar", asisten belajar matematika untuk siswa SMP kelas IX pada materi bilangan bentuk akar. Peranmu adalah PEMBIMBING PROSES BERPIKIR MATEMATIS, bukan pemberi jawaban.
ATURAN UTAMA:
1. Jangan pernah langsung memberikan jawaban akhir soal yang sedang dikerjakan siswa, walaupun siswa memaksa. Tolak dengan ramah, lalu beri petunjuk satu langkah.
2. Bantuan bertingkat (level_bantuan): 0 = bertanya balik menggali pemahaman; 1 = arah umum; 2 = langkah pertama yang konkret; 3 = contoh SOAL MIRIP dengan angka berbeda yang dikerjakan lengkap, lalu siswa mencoba soalnya sendiri. Naikkan level hanya jika siswa sudah mencoba dan masih kesulitan (lihat jumlah percobaan di konteks).
3. Jika siswa mengirim jawaban: jika benar, puji secara spesifik dan minta alasan atau tafsiran; jika salah, tunjukkan BAGIAN yang keliru tanpa menyebut jawaban benar, lalu beri petunjuk.
4. Kenali jenis kesulitan: prasyarat (kuadrat sempurna, faktorisasi), prosedur, konsep (misalnya mengira √a + √b = √(a + b)), atau membaca soal cerita.
BEBAN KOGNITIF: intrinsik = satu langkah per pesan, bantu prasyarat dulu jika lemah; ekstrinsik = pesan maksimal 60 kata, kalimat pendek, bahasa anak SMP, paling banyak satu rumus, notasi konsisten; germane = ajak menjelaskan "mengapa", mengenali pola, merangkum. Selalu akhiri dengan SATU pertanyaan atau tugas kecil.
LITERASI MATEMATIKA (soal cerita): Rumuskan (diketahui, ditanya, model) → Kerjakan → Tafsirkan (nilai pendekatan, satuan, kewajaran).
RMT (Kinard & Kozulin, 2008): Fase 1 Pengembangan kognitif (alat psikologis: label matematika, tabel kuadrat, pohon faktor, garis bilangan; fungsi kognitif: mengamati sistematis, memberi label, membandingkan, memilih informasi relevan, menemukan hubungan). Fase 2 Konten sebagai proses pembelajaran (siswa menemukan konsep sendiri dari contoh konkret: menganalisis, membandingkan, menggeneralisasi). Fase 3 Praktik konstruksi kognitif konseptual (menerapkan pada soal baru/konteks nyata, memeriksa, menjelaskan alasan, merefleksikan). Bertindak sebagai mediator (Feuerstein): intensionalitas dan resiprositas, makna, transendensi.
LAINNYA: arahkan kembali jika di luar matematika; jangan meminta data pribadi; informasi bertanda RAHASIA di konteks jangan pernah disebutkan; bahasa Indonesia ramah, boleh satu emoji.
FORMAT: jawab HANYA dengan satu objek JSON: {"pesan":"...","fase_rmt":1,"tahap_literasi":"rumuskan|kerjakan|tafsirkan|-","level_bantuan":0,"jenis_kesulitan":"prasyarat|prosedur|konsep|membaca soal|tidak ada"}`;
async function apiTutor(req){
  if(GAS) return gasCall('askTutorApi',req);
  if(SYNC_ON){
    const res=await fetch(CONFIG.SYNC_URL.trim(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'tutor',req})});
    return res.json();
  }
  const cfg=aiLocal();
  if(!cfg) return {ok:false,error:'nokey'};
  /* Tanpa server: panggil layanan AI langsung dari browser dengan key yang tersimpan di perangkat ini */
  const turns=req.messages.filter(m=>m.content).slice(-12).map(m=>({role:m.role,content:String(m.content).slice(0,600)}));
  while(turns.length&&turns[0].role!=='user') turns.shift();
  const body={model:cfg.model||AI_DEFAULT[cfg.provider],temperature:0.4,max_tokens:2000,
    messages:[{role:'system',content:TUTOR_RULES+'\n\nKONTEKS LAYAR SISWA SAAT INI:\n'+String(req.context||'-').slice(0,1200)}].concat(turns)};
  const headers={'Content-Type':'application/json','Authorization':'Bearer '+cfg.key};
  if(cfg.provider==='openrouter'){ headers['HTTP-Referer']=location.origin; headers['X-Title']='AkarKu'; }
  let res;
  try{ res=await fetch(AI_URLS[cfg.provider],{method:'POST',headers,body:JSON.stringify(body)}); }
  catch(_){ return {ok:false,error:'network'}; }
  if(!res.ok) return {ok:false,error:res.status===402?'saldo':(res.status===401||res.status===403)?'keysalah':res.status===429?'sibuk':(res.status===404||res.status===400)?'model':'api'};
  let text='';
  try{ const j=await res.json(); text=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||''; }catch(_){ return {ok:false,error:'api'}; }
  let out; try{ out=JSON.parse(text); }catch(_){ const m=String(text).match(/\{[\s\S]*\}/); try{ out=m?JSON.parse(m[0]):{pesan:text}; }catch(__){ out={pesan:text}; } }

function sqGrid(){
  let a=parseInt(S.sq.from,10),b=parseInt(S.sq.to,10);
  if(!(a>=1)||!(b>=1)) return '<p class="small muted">Isi kedua kotak dengan angka 1 sampai 1.000.</p>';
  a=Math.min(a,1000);b=Math.min(b,1000); if(a>b){const t=a;a=b;b=t}
  let note=''; if(b-a+1>50){b=a+49;note=`<p class="small muted">Ditampilkan 50 angka pertama: ${a} sampai ${b}.</p>`}
  const sel=parseInt(S.sq.one,10), cells=[];
  for(let i=a;i<=b;i++) cells.push(`<button class="sqc ${i===sel?'on':''}" data-act="sqPick" data-n="${i}" aria-label="${i} kuadrat sama dengan ${i*i}"><span>${num(i)}²</span><b>${num(i*i)}</b></button>`);
  return note+`<div class="sq">${cells.join('')}</div>`;
}
function sqOne(){
  const v=S.sq.one; if(v===''||v==null) return '<span class="muted small" style="font-weight:600">Ketik angka atau ketuk kotak di tabel.</span>';

}

    case 'calc': { const c=S.calc; const out=c.tab==='sederhana'?calcSimplify(c.s.a,c.s.n,c.s.b):c.tab==='operasi'?calcOp(c.o):calcRas(c.r);
      c.out=out; if(!out.err) logEv('kalkulator',strip(out.expr),strip(out.res),null);
      render(); const co=document.getElementById('calcOut'); if(co&&co.scrollIntoView) co.scrollIntoView({behavior:'smooth',block:'start'}); break; }
    /* laporan */
    case 'repSel': S.repSel=+el.dataset.i; render(); break;
    case 'sharePdf': studentPdf(); break;
    case 'ownerPdf': ownerPdf(); break;
    case 'pdfShare': { const p=S.pdf; if(!p||!p.blob) return; try{ navigator.share({files:[new File([p.blob],p.name,{type:'application/pdf'})],title:p.name}).catch(()=>{}); }catch(_){} break; }
    /* pemilik */
    case 'pinCreate': { const o=S.owner; if(!/^\d{4,6}$/.test(o.pinDraft)){o.msg='PIN harus 4 sampai 6 angka.';render();return}
      if(o.pinDraft!==o.pinDraft2){o.msg='Kedua PIN tidak sama. Ketik ulang.';render();return}
      P.pin=o.pinDraft; save(); o.unlocked=true; o.pinDraft=o.pinDraft2=''; o.msg=''; render(); break; }
    case 'pinEnter': { const o=S.owner; if(o.pinDraft===P.pin){o.unlocked=true;o.msg='';o.pinDraft='';if(SYNC_ON&&o.key&&o.src==='online') setTimeout(fetchOnline,0)}else{o.msg='PIN salah.';o.pinDraft=''} render(); break; }
    case 'lock': Object.assign(S.owner,{unlocked:false,open:{},confirmDel:false,msg:'',csv:null,online:null,onlineErr:''}); S.pdf=null; go('beranda'); break;
    case 'osrc': S.owner.src=el.dataset.s; S.owner.open={}; S.owner.msg=''; S.owner.csv=null; S.pdf=null; render(); if(S.owner.src==='online'&&!S.owner.online&&S.owner.key) fetchOnline(); break;
    case 'ofetch': fetchOnline(); break;
    case 'aiProv': S.owner.ai.provider=el.dataset.p; S.owner.ai.msg=''; render(); break;
    case 'aiSave': aiSave(); break;
    case 'aiTest': aiTest(); break;
    case 'aiForget': try{localStorage.removeItem(AI_LKEY)}catch(_){} S.owner.ai.msg='Key dihapus dari perangkat ini.'; render(); break;
    case 'otoggle': { const id=el.dataset.id; S.owner.open[id]=!S.owner.open[id]; render(); break; }
    case 'csv': saveCsv(el.dataset.k); break;
    case 'copyCsv': { const box=document.getElementById('csvBox'); const txt=S.owner.csv||'';
      const fb=()=>{ if(box){box.focus();box.select()} S.owner.msg='Teks sudah dipilih. Tekan lama lalu pilih Salin.'; };
      try{ navigator.clipboard.writeText(txt).then(()=>{S.owner.msg='✓ Teks CSV disalin.';render()},fb) }catch(_){ fb() } break; }
    case 'delAsk': S.owner.confirmDel=true; render(); break;
    case 'delNo': S.owner.confirmDel=false; render(); break;
    case 'delYes': P.users={}; P.log=[]; P.current=null; S.owner.confirmDel=false; S.owner.open={}; S.owner.msg='Semua data di perangkat ini sudah dihapus.'; save(); render(); break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='chatInput'&&!e.shiftKey){ e.preventDefault(); sendChat(e.target.value); return; }
  if(e.key==='Escape'&&S.chat.open){ S.chat.open=false; renderSheet(); return; }
  if(e.key==='Enter'){
    const id=e.target.id;
    if(id==='nick'||id==='code'){ e.preventDefault(); const b=document.querySelector('[data-act="start"]'); if(b) b.click(); }
    if(id==='pin1'||id==='pin2'){ e.preventDefault(); const b=document.querySelector('[data-act="pinCreate"],[data-act="pinEnter"]'); if(b) b.click(); }
    if(/^(c_|o_|r_)/.test(id)){ e.preventDefault(); const b=document.querySelector('[data-act="calc"]'); if(b) b.click(); }
  }
  if(e.key==='Escape'&&S.sheet){ S.sheet=null; renderSheet(); }
});

/* Mulai */
(function init(){
  /* Link aktivasi Si Akar dari pemilik: ...#ai=<kode>. Kode disimpan di perangkat ini lalu dihapus dari alamat. */
  if(location.hash.startsWith('#ai=')){
    try{ const c=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(4).replace(/-/g,'+').replace(/_/g,'/')))));
      if(c&&c.k&&AI_URLS[c.p]){ localStorage.setItem(AI_LKEY,JSON.stringify({provider:c.p,key:String(c.k),model:String(c.m||'')})); S.aiActivated=true; } }catch(_){}
    try{ history.replaceState(null,'',location.pathname+location.search+'#beranda'); }catch(_){ location.hash='beranda'; }
  }
  if(P.current&&!P.users[P.current]) P.current=null;
  if(P.current){ P.users[P.current].lastSeen=Date.now(); logEv('kunjungan','Membuka aplikasi','',null); }
  const v=location.hash.slice(1);
  S.view=VIEWS.includes(v)?v:'beranda';
  if(NEED_USER.includes(S.view)&&!P.current) S.view='beranda';
  if(S.view==='latihan') newPrac('mudah');
  if(S.view==='literasi') newLit();
  resetScr();
  render();
  flush();
})();
</script>
